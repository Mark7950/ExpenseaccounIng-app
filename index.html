<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Мои расходы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #ffffff;
    --text: #222222;
    --hint: #8a8a8e;
    --secondary-bg: #f2f2f7;
    --card-bg: #ffffff;
    --accent: #3390ec;
    --danger: #eb5545;
    --border: rgba(0,0,0,.08);
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Roboto, 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
  }
  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: -.3px; }
  .export-btn {
    border: none; background: var(--secondary-bg); color: var(--hint);
    font-size: 18px; width: 36px; height: 36px; border-radius: 12px; cursor: pointer;
  }
  .total-card {
    background: linear-gradient(135deg, #3390ec, #6a5df5);
    color: #fff;
    border-radius: 18px;
    padding: 18px 20px;
    margin-bottom: 16px;
    box-shadow: 0 8px 24px rgba(51,144,236,.25);
  }
  .total-card .label { font-size: 13px; opacity: .85; display: block; margin-bottom: 4px; }
  .total-card .sum { font-size: 32px; font-weight: 800; letter-spacing: -.5px; }
  .total-card .count { font-size: 13px; opacity: .85; margin-top: 4px; display: block; }

  form.add {
    display: flex; gap: 8px; margin-bottom: 8px;
  }
  form.add input {
    flex: 1;
    background: var(--secondary-bg);
    border: 1.5px solid transparent;
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 16px;
    color: var(--text);
    outline: none;
    transition: border-color .15s;
  }
  form.add input:focus { border-color: var(--accent); }
  form.add input::placeholder { color: var(--hint); }
  form.add button {
    border: none; background: var(--accent); color: #fff;
    font-size: 24px; font-weight: 600; border-radius: 14px;
    width: 54px; cursor: pointer; flex-shrink: 0;
    transition: transform .1s;
  }
  form.add button:active { transform: scale(.94); }
  form.add.shake input { animation: shake .3s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  .guess {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 8px 2px; font-size: 13px; color: var(--hint);
  }
  .guess.hidden { visibility: hidden; }
  .chip {
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--hint);
    border-radius: 20px;
    padding: 5px 11px;
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
  }
  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .stats { margin-bottom: 16px; }
  .stat-row { margin-bottom: 10px; }
  .stat-top {
    display: flex; justify-content: space-between;
    font-size: 14px; margin-bottom: 5px;
  }
  .stat-top .pct { color: var(--hint); }
  .bar {
    height: 6px; border-radius: 3px;
    background: var(--secondary-bg);
    overflow: hidden;
  }
  .bar > div { height: 100%; border-radius: 3px; background: var(--accent); transition: width .3s; }

  .list-title {
    font-size: 13px; font-weight: 600; color: var(--hint);
    text-transform: uppercase; letter-spacing: .4px;
    margin-bottom: 8px;
  }
  .list {
    background: var(--card-bg);
    border-radius: 16px;
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }
  .item:last-child { border-bottom: none; }
  .item-emoji {
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--secondary-bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 19px; flex-shrink: 0;
  }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-meta { font-size: 12.5px; color: var(--hint); margin-top: 2px; }
  .item-right { text-align: right; flex-shrink: 0; }
  .item-amount { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .item .del {
    border: none; background: none; color: var(--hint);
    font-size: 18px; cursor: pointer; padding: 2px 4px; margin-top: 2px;
    line-height: 1;
  }
  .empty {
    text-align: center; color: var(--hint);
    padding: 36px 0; font-size: 14px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Мои расходы</h1>
    <button class="export-btn" id="exportBtn" title="Скачать CSV">↧</button>
  </header>

  <div class="total-card">
    <span class="label">Расходы за <span id="monthName"></span></span>
    <span class="sum" id="monthTotal">0 ₽</span>
    <span class="count" id="monthCount"></span>
  </div>

  <form class="add" id="addForm" autocomplete="off">
    <input id="input" placeholder="Например: кофе 350" inputmode="text">
    <button type="submit">+</button>
  </form>

  <div class="guess hidden" id="guess"></div>

  <section class="stats" id="stats"></section>

  <div class="list-title">История</div>
  <section class="list" id="list"></section>
</div>

<script>
// ---------- Telegram ----------
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
}

function applyTheme() {
  const t = (tg && tg.themeParams) || {};
  const r = document.documentElement.style;
  r.setProperty('--bg', t.bg_color || '#ffffff');
  r.setProperty('--text', t.text_color || '#222222');
  r.setProperty('--hint', t.hint_color || '#8a8a8e');
  r.setProperty('--secondary-bg', t.secondary_bg_color || '#f2f2f7');
  r.setProperty('--accent', t.button_color || '#3390ec');
}
applyTheme();
if (tg) tg.onEvent('themeChanged', applyTheme);

function haptic(kind) {
  if (tg && tg.HapticFeedback) {
    if (kind === 'ok') tg.HapticFeedback.notificationOccurred('success');
    else tg.HapticFeedback.impactOccurred('light');
  }
}

// ---------- Категории ----------
const CATS = [
  { name: 'Еда', emoji: '🍔', words: ['кофе','чай','еда','обед','ужин','завтрак','пицца','булка','хлеб','молоко','суп','шаверма','шаурма','снек','продукты','магнит','пятёрочка','пятерочка','лента','вкусвилл','бургер','роллы','суши','перекус','доставка','яндекс еда','самокат еды','мороженое','шоколад','вода','сок','пирожок','салат','яйца','сыр','фрукт','яблоко'] },
  { name: 'Транспорт', emoji: '🚕', words: ['такси','яндекс такси','метро','автобус','троллейбус','трамвай','бензин','заправка','проезд','каршеринг','маршрутка','электричка','поезд','самолёт','самолет','билет','мцд','оцикт'] },
  { name: 'Дом', emoji: '🏠', words: ['аренда','квартплата','жкх','коммуналка','мебель','быт','хозяйственный','уборка','ремонт','лампочки','грязь чисто','стирка'] },
  { name: 'Развлечения', emoji: '🎬', words: ['кино','игра','игры','стим','концерт','бар','кальян','подписка','нетфликс','спотифай','книга','книги','театр','музей','боулинг','бильярд','тир'] },
  { name: 'Здоровье', emoji: '💊', words: ['аптека','лекарство','таблетки','врач','стоматолог','анализы','витамины','спорт','зал','фитнес','абонемент'] },
  { name: 'Связь', emoji: '📱', words: ['интернет','связь','телефон','мтс','билайн','мегафон','теле2','т2','пополнение','связной'] },
  { name: 'Другое', emoji: '📦', words: [] }
];

function detectCat(name) {
  const n = name.toLowerCase();
  for (const c of CATS) {
    if (c.words.some(w => n.includes(w))) return c.name;
  }
  return 'Другое';
}
function catByName(name) { return CATS.find(c => c.name === name) || CATS[CATS.length - 1]; }

// ---------- Парсинг ввода ----------
function parseInput(text) {
  const trimmed = text.trim();
  if (!trimmed) return null;
  const m = trimmed.match(/(\d[\d\s]*(?:[.,]\d+)?)/);
  if (!m) return null;
  const amount = parseFloat(m[1].replace(/\s/g, '').replace(',', '.'));
  if (!isFinite(amount) || amount <= 0) return null;
  const name = trimmed.replace(m[1], '').replace(/\s+/g, ' ').trim();
  if (!name) return null;
  return { name, amount };
}

// ---------- Хранилище ----------
const LS_KEY = 'expenseTracker.v1';
let expenses = [];
try { expenses = JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch (e) { expenses = []; }

function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(expenses)); } catch (e) {}
}

// ---------- Форматирование ----------
const fmt = n => new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 2 }).format(n) + ' ₽';
const MONTHS_NOM = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MONTHS_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_ABBR = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];

function dateStr(ts) {
  const d = new Date(ts);
  return d.getDate() + ' ' + MONTHS_ABBR[d.getMonth()];
}

// ---------- Элементы ----------
const input = document.getElementById('input');
const addForm = document.getElementById('addForm');
const guessBox = document.getElementById('guess');
const statsBox = document.getElementById('stats');
const listBox = document.getElementById('list');
const monthTotalEl = document.getElementById('monthTotal');
const monthCountEl = document.getElementById('monthCount');
const monthNameEl = document.getElementById('monthName');

let pendingCat = null;

// ---------- Превью и чипы категорий ----------
function renderGuess() {
  const p = parseInput(input.value);
  if (!p) {
    guessBox.classList.add('hidden');
    guessBox.innerHTML = '';
    return;
  }
  const detected = detectCat(p.name);
  if (pendingCat === null) pendingCat = detected;
  guessBox.classList.remove('hidden');
  guessBox.innerHTML =
    '<span>' + p.name + ' · ' + fmt(p.amount) + ' →</span>' +
    CATS.map(c =>
      '<button type="button" class="chip' + (c.name === pendingCat ? ' active' : '') + '" data-cat="' + c.name + '">' +
      c.emoji + ' ' + c.name + '</button>'
    ).join('');
}
guessBox.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip) {
    pendingCat = chip.dataset.cat;
    haptic('light');
    renderGuess();
  }
});
input.addEventListener('input', () => { pendingCat = null; renderGuess(); });

// ---------- Добавление ----------
addForm.addEventListener('submit', e => {
  e.preventDefault();
  const p = parseInput(input.value);
  if (!p) {
    addForm.classList.remove('shake');
    void addForm.offsetWidth;
    addForm.classList.add('shake');
    haptic('light');
    return;
  }
  expenses.push({
    id: Date.now() + Math.random().toString(16).slice(2),
    name: p.name,
    amount: p.amount,
    cat: pendingCat || detectCat(p.name),
    ts: Date.now()
  });
  save();
  input.value = '';
  pendingCat = null;
  renderGuess();
  render();
  haptic('ok');
});

// ---------- Удаление ----------
listBox.addEventListener('click', e => {
  const btn = e.target.closest('.del');
  if (!btn) return;
  const id = btn.dataset.id;
  expenses = expenses.filter(x => x.id !== id);
  save();
  render();
  haptic('light');
});

// ---------- Рендер ----------
function currentMonthItems() {
  const now = new Date();
  return expenses.filter(x => {
    const d = new Date(x.ts);
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  });
}

function render() {
  const items = currentMonthItems();
  const total = items.reduce((s, x) => s + x.amount, 0);
  monthNameEl.textContent = MONTHS_NOM[new Date().getMonth()];
  monthTotalEl.textContent = fmt(total);
  monthCountEl.textContent = items.length
    ? items.length + ' ' + plural(items.length, ['запись','записи','записей'])
    : 'нет записей за этот месяц';

  // Статистика по категориям
  const byCat = {};
  items.forEach(x => { byCat[x.cat] = (byCat[x.cat] || 0) + x.amount; });
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  statsBox.innerHTML = total > 0
    ? cats.map(([name, sum]) => {
        const c = catByName(name);
        const pct = Math.round(sum / total * 100);
        return '<div class="stat-row">' +
          '<div class="stat-top"><span>' + c.emoji + ' ' + name + '</span>' +
          '<span class="pct">' + fmt(sum) + ' · ' + pct + '%</span></div>' +
          '<div class="bar"><div style="width:' + pct + '%"></div></div></div>';
      }).join('')
    : '';

  // История (все записи, свежие сверху)
  const sorted = expenses.slice().sort((a, b) => b.ts - a.ts);
  listBox.innerHTML = sorted.length
    ? sorted.map(x => {
        const c = catByName(x.cat);
        return '<div class="item">' +
          '<div class="item-emoji">' + c.emoji + '</div>' +
          '<div class="item-info"><div class="item-name">' + esc(x.name) + '</div>' +
          '<div class="item-meta">' + x.cat + ' · ' + dateStr(x.ts) + '</div></div>' +
          '<div class="item-right"><div class="item-amount">' + fmt(x.amount) + '</div>' +
          '<button class="del" data-id="' + x.id + '" title="Удалить">✕</button></div>' +
          '</div>';
      }).join('')
    : '<div class="empty">Пока пусто. Добавь первую трату ↑</div>';
}

function plural(n, forms) {
  const mod10 = n % 10, mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return forms[0];
  if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return forms[1];
  return forms[2];
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ---------- Экспорт CSV ----------
document.getElementById('exportBtn').addEventListener('click', () => {
  if (!expenses.length) return;
  const rows = [['Дата','Категория','Название','Сумма']];
  expenses.slice().sort((a,b) => b.ts - a.ts).forEach(x => {
    const d = new Date(x.ts);
    const ds = d.toLocaleDateString('ru-RU');
    rows.push([ds, x.cat, x.name, String(x.amount).replace('.', ',')]);
  });
  const csv = '\uFEFF' + rows.map(r => r.map(c => '"' + String(c).replace(/"/g,'""') + '"').join(';')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'расходы_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
  haptic('ok');
});

// ---------- Старт ----------
render();
</script>
</body>
</html>
