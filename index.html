<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Траты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --accent:#3b82f6; --accent2:#1d4ed8; --danger:#ef4444;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    transition:background .25s,color .25s; overscroll-behavior:none}
  body.theme-light{--bg:#f2f4f8;--card:#ffffff;--text:#1c1e29;--muted:#8b90a0;--border:#e6e8ef;--chipbg:#eef1f6;--shadow:0 6px 20px rgba(30,40,70,.08)}
  body.theme-dark{--bg:#1a1c26;--card:#252837;--text:#f2f3f8;--muted:#9aa0b4;--border:#333750;--chipbg:#2e3245;--shadow:0 6px 20px rgba(0,0,0,.35)}
  .wrap{max-width:480px;margin:0 auto;padding:14px 16px 90px}

  /* ---------- header ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 14px}
  .top h1{font-size:19px;font-weight:800}
  .gear{width:36px;height:36px;border:none;border-radius:50%;background:var(--chipbg);color:var(--text);
    font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}

  /* ---------- balance card ---------- */
  .balance-card{background:linear-gradient(135deg,#60a5fa 0%,#2563eb 55%,#1e40af 100%);
    border-radius:18px;padding:22px 20px;color:#fff;box-shadow:0 10px 26px rgba(37,99,235,.35)}
  .balance-card .lbl{font-size:12.5px;opacity:.85;font-weight:600;letter-spacing:.3px}
  .balance-card .val{font-size:30px;font-weight:800;margin-top:6px;letter-spacing:.4px}
  .balance-card .val.negative{color:#fecaca}
  .balance-card .hint{margin-top:10px;font-size:12px;opacity:.75}

  /* ---------- input ---------- */
  .input-row{display:flex;gap:8px;margin-top:14px}
  .main-input{flex:1;border:1.5px solid var(--border);background:var(--card);color:var(--text);
    border-radius:13px;padding:12px 14px;font-size:15px;outline:none}
  .main-input:focus{border-color:var(--accent)}
  .add-btn{border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
    border-radius:13px;padding:0 18px;font-size:15px;font-weight:700;cursor:pointer}
  .preview{margin-top:8px;font-size:13px;color:var(--muted);min-height:18px}
  .preview b{color:var(--text)}

  /* ---------- chips ---------- */
  .chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1.5px solid var(--border);background:var(--card);color:var(--text);
    border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
  .chip.active{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}

  /* ---------- section cards ---------- */
  .sec{margin-top:18px}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .sec-head h2{font-size:15px;font-weight:700}
  .arrow-btn{width:30px;height:30px;border:none;border-radius:50%;background:var(--chipbg);color:var(--text);
    font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .card{background:var(--card);border-radius:14px;box-shadow:var(--shadow)}
  .cat-row{display:flex;align-items:center;gap:10px;padding:10px 14px}
  .cat-row .emoji{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
  .cat-info{flex:1;min-width:0}
  .cat-top{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600}
  .cat-top .sum{font-variant-numeric:tabular-nums}
  .bar{height:5px;border-radius:3px;background:var(--chipbg);margin-top:6px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:3px}
  .pct{font-size:11.5px;color:var(--muted);margin-top:3px}

  .op-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border)}
  .op-row:last-child{border-bottom:none}
  .op-emoji{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
  .op-info{flex:1;min-width:0}
  .op-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .op-cat{font-size:11.5px;color:var(--muted);margin-top:2px}
  .op-sum{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums}
  .del{border:none;background:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px 2px 4px 8px}
  .empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:13.5px}

  /* ---------- onboarding ---------- */
  .screen{display:none}
  .screen.active{display:block}
  .ob-card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:26px 20px;margin-top:26vh;text-align:center}
  .ob-card .wave{font-size:40px}
  .ob-card h2{font-size:20px;font-weight:800;margin-top:10px}
  .ob-card p{font-size:13.5px;color:var(--muted);margin-top:6px;line-height:1.45}
  .ob-label{margin-top:18px;font-size:12.5px;font-weight:600;color:var(--muted);text-align:left}
  .ob-input{width:100%;margin-top:6px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);
    border-radius:11px;padding:10px 13px;font-size:17px;font-weight:600;outline:none;text-align:center}
  .ob-input:focus{border-color:var(--accent)}
  .cur-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
  .cur-btn{border:1.5px solid var(--border);background:var(--card);color:var(--text);border-radius:11px;
    padding:7px 4px;cursor:pointer;text-align:center}
  .cur-btn .sym{font-size:16px;font-weight:700;display:block;line-height:1.2}
  .cur-btn .nm{font-size:10px;color:var(--muted);margin-top:2px;display:block}
  .cur-btn.active{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
  .ob-btn{width:100%;margin-top:20px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff;border-radius:13px;padding:13px;font-size:15.5px;font-weight:700;cursor:pointer}
  .ob-note{margin-top:12px;font-size:12.5px;color:var(--muted)}

  /* ---------- sheets ---------- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
  .overlay.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;transform:translateY(105%);transition:transform .25s;
    background:var(--card);border-radius:20px 20px 0 0;padding:16px 18px 26px;z-index:60;max-width:480px;margin:0 auto}
  .sheet.show{transform:translateY(0)}
  .sheet h3{font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
  .sheet .back{border:none;background:var(--chipbg);color:var(--text);border-radius:9px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
  .menu-item{display:flex;align-items:center;justify-content:space-between;width:100%;
    background:var(--chipbg);border:none;border-radius:13px;padding:14px 16px;margin-top:10px;
    color:var(--text);font-size:14.5px;font-weight:600;cursor:pointer}
  .theme-opts{display:flex;gap:8px;margin-top:12px}
  .theme-opt{flex:1;border:1.5px solid var(--border);background:var(--card);color:var(--text);
    border-radius:11px;padding:11px 6px;font-size:12.5px;font-weight:600;cursor:pointer}
  .theme-opt.active{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
  .sheet .cur-grid{margin-top:12px}

  /* ---------- history page ---------- */
  .page{position:fixed;inset:0;background:var(--bg);z-index:40;transform:translateX(100%);transition:transform .25s;overflow-y:auto}
  .page.show{transform:translateX(0)}
  .page-inner{max-width:480px;margin:0 auto;padding:14px 16px 40px}
  .page-top{display:flex;align-items:center;gap:10px;padding:4px 0 14px}
  .page-top h2{font-size:18px;font-weight:800;flex:1}
  .month-nav{display:flex;align-items:center;justify-content:space-between;background:var(--card);
    border-radius:12px;padding:9px 12px;box-shadow:var(--shadow)}
  .month-nav span{font-size:14.5px;font-weight:700}
  .m-arrow{border:none;background:var(--chipbg);color:var(--text);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:14px}
  .month-sum{margin-top:12px;text-align:center;font-size:13px;color:var(--muted)}
  .month-sum b{display:block;font-size:20px;color:var(--text);margin-top:2px}
  .day-label{margin:16px 2px 6px;font-size:12px;font-weight:700;color:var(--muted)}
</style>
</head>
<body class="theme-light">

<!-- ======== ЭКРАН 1: ОНБОРДИНГ ======== -->
<div class="screen active" id="scr-onboard">
  <div class="wrap">
    <div class="ob-card">
      <div class="wave">👋</div>
      <h2>Добро пожаловать!</h2>
      <p>Сколько денег у тебя на данный момент?</p>
      <div class="ob-label">Твой баланс</div>
      <input class="ob-input" id="ob-balance" type="text" inputmode="decimal" placeholder="0">
      <div class="ob-label">Валюта</div>
      <div class="cur-grid" id="ob-currencies"></div>
      <button class="ob-btn" id="ob-start">Начать</button>
      <div class="ob-note">С этой суммы мы начнём вести твой баланс 💰</div>
    </div>
  </div>
</div>

<!-- ======== ЭКРАН 2: ГЛАВНЫЙ ======== -->
<div class="screen" id="scr-main">
  <div class="wrap">
    <div class="top">
      <h1>Траты</h1>
      <button class="gear" id="btn-gear">⚙️</button>
    </div>

    <div class="balance-card">
      <div class="lbl">ОСТАЛОСЬ НА БАЛАНСЕ</div>
      <div class="val" id="balance-val">0 ₸</div>
      <div class="hint" id="change-balance">Нажми, чтобы изменить баланс</div>
    </div>

    <div class="sec">
      <div class="input-row">
        <input class="main-input" id="exp-input" type="text" placeholder="кофе 350" inputmode="text">
        <button class="add-btn" id="btn-add">+</button>
      </div>
      <div class="preview" id="preview"></div>
      <div class="chips" id="chips"></div>
    </div>

    <div class="sec">
      <div class="sec-head"><h2>Статистика</h2></div>
      <div class="card" id="stats"></div>
    </div>

    <div class="sec">
      <div class="sec-head">
        <h2>Последние операции</h2>
        <button class="arrow-btn" id="btn-history">→</button>
      </div>
      <div class="card" id="recent"></div>
    </div>
  </div>
</div>

<!-- ======== ЭКРАН 3: ИСТОРИЯ ======== -->
<div class="page" id="scr-history">
  <div class="page-inner">
    <div class="page-top">
      <button class="arrow-btn" id="btn-back">←</button>
      <h2>История</h2>
    </div>
    <div class="month-nav">
      <button class="m-arrow" id="m-prev">‹</button>
      <span id="m-label">Октябрь 2026</span>
      <button class="m-arrow" id="m-next">›</button>
    </div>
    <div class="month-sum" id="m-sum"></div>
    <div id="m-list"></div>
  </div>
</div>

<!-- ======== МЕНЮ И ШТОРКИ ======== -->
<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet-menu">
  <h3>Настройки</h3>
  <button class="menu-item" id="mi-currency">💱 Валюта <span id="cur-current">₸</span></button>
  <button class="menu-item" id="mi-theme">🎨 Тема <span id="theme-current">Системная</span></button>
</div>
<div class="sheet" id="sheet-currency">
  <h3><span>Выбор валюты</span><button class="back" id="cur-back">‹ Назад</button></h3>
  <div class="cur-grid" id="menu-currencies"></div>
</div>
<div class="sheet" id="sheet-theme">
  <h3><span>Тема</span><button class="back" id="theme-back">‹ Назад</button></h3>
  <div class="theme-opts">
    <button class="theme-opt" data-theme="light">☀️ Светлая</button>
    <button class="theme-opt" data-theme="dark">🌙 Тёмная</button>
    <button class="theme-opt" data-theme="system">⚙️ Системная</button>
  </div>
</div>
<div class="sheet" id="sheet-balance">
  <h3><span>Изменить баланс</span><button class="back" id="bal-back">‹ Назад</button></h3>
  <input class="ob-input" id="bal-input" type="text" inputmode="decimal" style="margin-top:14px;text-align:left" placeholder="Новая сумма">
  <button class="ob-btn" id="bal-save" style="margin-top:14px">Сохранить</button>
</div>

  travel:    {n:'Путешествие',      e:'✈️', c:'#7e57c2', w:['отель','гостиница','хостел','авиабилеты','билет на самолет','самолет','бронирование','поездка','отпуск','тур','экскурсия','букинг','booking','airbnb','туристическая страховка','виза','путевка']},
  tax:       {n:'Налоги',           e:'🏛️', c:'#78909c', w:['налог','налоги','штраф гибдд','госпошлина','налоговая','пеня','платеж в бюджет','пошлина','обязательный платеж']},
  repair:    {n:'Ремонт',           e:'🛠️', c:'#8d6e63', w:['обои','краска','гипсокартон','ламинат','плитка','цемент','гвозди','шурупы','саморезы','инструмент','дрель','молоток','отвертка','ремонт','стройматериалы','грунтовка','шпаклевка','сантехник','электрик','мастер на час','вызов мастера','мебель','шкаф','диван','стол','стул','сборка мебели']},
  other:     {n:'Прочее',           e:'📦', c:'#95a5a6', w:['подарок','подарки','цветы','букет','донат','благотворительность','кредит','рассрочка','комиссия','перевод денег','перевод','штраф','прочее']}
};

/* валюты */
const CURRENCIES = [
  {s:'₸', n:'Тенге'},{s:'₽', n:'Рубль'},{s:'₴', n:'Гривна'},{s:'Br', n:'Бел. рубль'},
  {s:'$', n:'Доллар'},{s:'с', n:'Сом'},{s:'сум', n:'Сум'},{s:'֏', n:'Драм'}
];

/* ---------- состояние ---------- */
let S = {setup:false, balance:0, currency:0, theme:'system', expenses:[], previewCat:'other'};
function load(){
  try{ const raw = localStorage.getItem('spend_app'); if(raw) S = {...S, ...JSON.parse(raw)}; }catch(e){}
}
function save(){ localStorage.setItem('spend_app', JSON.stringify(S)); }

const $ = id => document.getElementById(id);
const fmt = n => new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(Math.round(n)) + ' ' + CURRENCIES[S.currency].s;
const haptic = () => { try{ if(tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light'); }catch(e){} };

/* ---------- парсер ввода и классификатор ---------- */
function parseInput(text){
  text = text.trim();
  const m = text.match(/(\d[\d\s\u00a0]*(?:[.,]\d{1,2})?|\d)/);
  if(!m) return null;
  const amount = parseFloat(m[1].replace(/[\s\u00a0]/g,'').replace(',','.'));
  if(!amount || amount <= 0) return null;
  let name = (text.replace(m[1],'').replace(/[^\wа-яёА-ЯЁa-zA-Z\s\-]/g,' ').trim()) || 'Трата';
  return {name, amount};
}
function detectCat(name){
  const t = ' ' + name.toLowerCase().replace(/[^\wа-яё\s\-]/g,' ') + ' ';
  /* сначала двухсловные фразы — они точнее */
  for(const [id,c] of Object.entries(CATS)){
    if(id==='other') continue;
    for(const w of c.w){ if(w.includes(' ') && t.includes(' '+w+' ')) return id; }
  }
  /* затем одиночные слова по границам */
  const words = t.split(/\s+/).filter(Boolean);
  let best = null, bestLen = 0;
  for(const [id,c] of Object.entries(CATS)){
    if(id==='other') continue;
    for(const w of c.w){
      if(!w.includes(' ') && words.includes(w) && w.length > bestLen){ best = id; bestLen = w.length; }
    }
  }
  return best || 'other';
}

/* ---------- рендер ---------- */
function renderBalance(){
  const el = $('balance-val');
  el.textContent = fmt(S.balance);
  el.classList.toggle('negative', S.balance < 0);
}
function renderChips(){
  $('chips').innerHTML = Object.entries(CATS).map(([id,c]) =>
    `<button class="chip ${id===S.previewCat?'active':''}" data-cat="${id}">${c.e} ${c.n}</button>`).join('');
}
function renderPreview(text){
  const p = parseInput(text);
  const el = $('preview');
  if(!p){ el.innerHTML = '<span style="opacity:.6">Напиши трату и сумму</span>'; S.previewCat='other'; renderChips(); return; }
  el.innerHTML = `<b>${p.name}</b> — ${fmt(p.amount)} в категорию <b>${CATS[S.previewCat].e} ${CATS[S.previewCat].n}</b>`;
}
function renderStats(){
  const month = new Date().toISOString().slice(0,7);
  const byCat = {};
  S.expenses.forEach(e => { const em = new Date(e.ts).toISOString().slice(0,7); if(em===month) byCat[e.cat]=(byCat[e.cat]||0)+e.amount; });
  const total = Object.values(byCat).reduce((a,b)=>a+b,0);
  const box = $('stats');
  if(!total){ box.innerHTML = '<div class="empty">В этом месяце пока пусто 👌</div>'; return; }
  box.innerHTML = Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([id,sum])=>{
    const c = CATS[id]; const pct = Math.round(sum/total*100);
    return `<div class="cat-row">
      <div class="emoji" style="background:${c.c}22">${c.e}</div>
      <div class="cat-info">
        <div class="cat-top"><span>${c.n}</span><span class="sum">${fmt(sum)}</span></div>
        <div class="bar"><i style="width:${pct}%;background:${c.c}"></i></div>
        <div class="pct">${pct}% от трат</div>
      </div></div>`;
  }).join('');
}
function renderRecent(){
  const recent = S.expenses.slice().sort((a,b)=>b.ts-a.ts).slice(0,2);
  $('recent').innerHTML = recent.length ? recent.map(opRow).join('') : '<div class="empty">Добавь первую трату выше ↑</div>';
}
function opRow(e){
  const c = CATS[e.cat] || CATS.other;
  const d = new Date(e.ts);
  const time = d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  return `<div class="op-row">
    <div class="op-emoji" style="background:${c.c}22">${c.e}</div>
    <div class="op-info"><div class="op-name">${e.name}</div><div class="op-cat">${c.n} · ${time}</div></div>
    <div class="op-sum">−${fmt(e.amount)}</div>
    <button class="del" data-del="${e.id}">✕</button></div>`;
}
function renderAll(){ renderBalance(); renderStats(); renderRecent(); }

/* ---------- история ---------- */
let histMonth = new Date().toISOString().slice(0,7);
const MON = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function renderHistory(){
  const [y,m] = histMonth.split('-').map(Number);
  $('m-label').textContent = MON[m-1] + ' ' + y;
  const list = S.expenses.filter(e => new Date(e.ts).toISOString().slice(0,7)===histMonth).sort((a,b)=>b.ts-a.ts);
  const total = list.reduce((a,e)=>a+e.amount,0);
  $('m-sum').innerHTML = total ? `Всего за месяц<b>${fmt(total)}</b>` : 'В этом месяце трат нет';
  if(!list.length){ $('m-list').innerHTML=''; return; }
  const today = new Date(); today.setHours(0,0,0,0);
  const yest = new Date(today); yest.setDate(yest.getDate()-1);
  const groups = {};
  list.forEach(e => {
    const d = new Date(e.ts); d.setHours(0,0,0,0);
    let label;
    if(+d===+today) label='Сегодня';
    else if(+d===+yest) label='Вчера';
    else label = d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
    (groups[label]=groups[label]||[]).push(e);
  });
  $('m-list').innerHTML = Object.entries(groups).map(([label,arr]) =>
    `<div class="day-label">${label}</div><div class="card">${arr.map(opRow).join('')}</div>`).join('');
}

/* ---------- темы ---------- */
function applyTheme(){
  let dark;
  if(S.theme==='light') dark=false;
  else if(S.theme==='dark') dark=true;
  else dark = tg ? (tg.colorScheme==='dark') : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.body.className = dark ? 'theme-dark' : 'theme-light';
  $('theme-current').textContent = S.theme==='light'?'Светлая':S.theme==='dark'?'Тёмная':'Системная';
  document.querySelectorAll('.theme-opt').forEach(b=>b.classList.toggle('active', b.dataset.theme===S.theme));
}
if(tg && tg.onEvent) tg.onEvent('themeParamsChanged', applyTheme);

/* ---------- шторки ---------- */
function openSheet(id){ $('overlay').classList.add('show'); $(id).classList.add('show'); haptic(); }
function closeSheets(){ document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('show')); $('overlay').classList.remove('show'); }
$('overlay').onclick = closeSheets;

function renderCurrencyGrids(){
  const html = CURRENCIES.map((c,i)=>
    `<button class="cur-btn ${i===S.currency?'active':''}" data-i="${i}"><span class="sym">${c.s}</span><span class="nm">${c.n}</span></button>`).join('');
  $('ob-currencies').innerHTML = html;
  $('menu-currencies').innerHTML = html;
}
document.body.addEventListener('click', e=>{
  const cb = e.target.closest('.cur-btn');
  if(cb){ S.currency = +cb.dataset.i; $('cur-current').textContent = CURRENCIES[S.currency].s; renderCurrencyGrids(); renderAll(); renderPreview($('exp-input').value); save(); haptic(); }
  const ch = e.target.closest('.chip');
  if(ch){ S.previewCat = ch.dataset.cat; renderChips(); renderPreview($('exp-input').value); haptic(); }
  const del = e.target.closest('[data-del]');
  if(del){
    const id = del.dataset.del;
    const ex = S.expenses.find(x=>x.id===id);
    if(ex){ S.balance += ex.amount; S.expenses = S.expenses.filter(x=>x.id!==id); save(); renderAll(); renderHistory(); haptic(); }
  }
  const th = e.target.closest('.theme-opt');
  if(th){ S.theme = th.dataset.theme; save(); applyTheme(); haptic(); }
});

/* ---------- события ---------- */
$('exp-input').addEventListener('input', e => {
  const p = parseInput(e.target.value);
  if(p) S.previewCat = detectCat(p.name);
  renderPreview(e.target.value);
});
function addExpense(){
  const p = parseInput($('exp-input').value);
  if(!p) return;
  S.expenses.push({id:'e'+Date.now(), name:p.name, amount:p.amount, cat:S.previewCat, ts:Date.now()});
  S.balance -= p.amount;
  save();
  $('exp-input').value = '';
  renderAll();
  haptic();
}
$('btn-add').onclick = addExpense;
$('exp-input').addEventListener('keydown', e => { if(e.key==='Enter') addExpense(); });

$('btn-gear').onclick = () => openSheet('sheet-menu');
$('mi-currency').onclick = () => { $('sheet-menu').classList.remove('show'); $('sheet-currency').classList.add('show'); };
$('mi-theme').onclick = () => { $('sheet-menu').classList.remove('show'); $('sheet-theme').classList.add('show'); };
$('cur-back').onclick = () => { $('sheet-currency').classList.remove('show'); $('sheet-menu').classList.add('show'); };
$('theme-back').onclick = () => { $('sheet-theme').classList.remove('show'); $('sheet-menu').classList.add('show'); };

$('change-balance').onclick = () => { $('bal-input').value = S.balance; openSheet('sheet-balance'); };
$('bal-back').onclick = closeSheets;
$('bal-save').onclick = () => {
  const v = parseFloat($('bal-input').value.replace(/[\s\u00a0]/g,'').replace(',','.'));
  if(!isNaN(v)){ S.balance = v; save(); renderAll(); haptic(); }
  closeSheets();
};

$('btn-history').onclick = () => { histMonth = new Date().toISOString().slice(0,7); renderHistory(); $('scr-history').classList.add('show'); haptic(); };
$('btn-back').onclick = () => $('scr-history').classList.remove('show');
$('m-prev').onclick = () => { const [y,m]=histMonth.split('-').map(Number); const d=new Date(y,m-2,1); histMonth=d.toISOString().slice(0,7); renderHistory(); haptic(); };
$('m-next').onclick = () => { const [y,m]=histMonth.split('-').map(Number); const d=new Date(y,m,1); histMonth=d.toISOString().slice(0,7); renderHistory(); haptic(); };

/* ---------- старт ---------- */
$('ob-start').onclick = () => {
  const v = parseFloat($('ob-balance').value.replace(/[\s\u00a0]/g,'').replace(',','.')) || 0;
  S.balance = v; S.setup = true; save();
  $('scr-onboard').classList.remove('active'); $('scr-main').classList.add('active');
  renderAll(); haptic();
};

load();
renderCurrencyGrids();
$('cur-current').textContent = CURRENCIES[S.currency].s;
applyTheme();
if(S.setup){ $('scr-onboard').classList.remove('active'); $('scr-main').classList.add('active'); renderAll(); }
renderPreview('');
</script>
</body>
</html>
