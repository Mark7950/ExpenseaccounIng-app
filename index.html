<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Траты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#f2f4f8; --card:#ffffff; --text:#1a1d26; --muted:#8a90a0;
    --accent:#3d7bd8; --accent2:#2563eb; --line:rgba(0,0,0,.07);
    --chip:#f0f3f8; --danger:#e5484d;
  }
  html[data-theme="dark"]{
    --bg:#17212b; --card:#232f3e; --text:#f5f5f5; --muted:#8b98a9;
    --line:rgba(255,255,255,.08); --chip:#2b3a4d;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);
    min-height:100vh;transition:background .3s,color .3s}
  .wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px}

  /* ===== Онбординг ===== */
  #onboard{padding-top:36px;text-align:center}
  .ob-emoji{font-size:56px;margin-bottom:12px}
  .ob-title{font-size:24px;font-weight:700;margin-bottom:6px}
  .ob-sub{font-size:14px;color:var(--muted);margin-bottom:26px}
  .ob-label{font-size:13px;font-weight:600;color:var(--muted);text-align:left;margin:18px 2px 8px}
  #curGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .cur-btn{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:7px 2px;
    font-size:15px;font-weight:600;cursor:pointer;transition:.15s}
  .cur-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(61,123,216,.08)}
  #balInput{width:100%;padding:11px 14px;font-size:17px;border:2px solid var(--line);border-radius:12px;
    background:var(--card);color:var(--text);outline:none;transition:.15s}
  #balInput:focus{border-color:var(--accent)}
  .ob-hint{font-size:13px;color:var(--muted);margin-top:12px}
  .btn-main{width:100%;margin-top:24px;padding:13px;border:none;border-radius:12px;font-size:16px;font-weight:600;
    background:linear-gradient(135deg,#4E9BF5,#2563EB);color:#fff;cursor:pointer}
  .btn-main:active{transform:scale(.98)}

  /* ===== Шапка ===== */
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .app-name{font-size:20px;font-weight:700}
  #gearBtn{width:38px;height:38px;border-radius:50%;border:none;background:var(--card);font-size:18px;
    cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.08)}

  /* ===== Карточка баланса (синяя) ===== */
  .balance-card{background:linear-gradient(135deg,#4E9BF5 0%,#2563EB 100%);border-radius:16px;
    padding:20px;color:#fff;box-shadow:0 6px 20px rgba(37,99,235,.30);margin-bottom:16px}
  .balance-card .lbl{font-size:13px;opacity:.85;margin-bottom:4px}
  #balanceVal{font-size:32px;font-weight:700;letter-spacing:-.5px}
  #balanceVal.neg{color:#ffd3d3}
  .balance-card .sub{font-size:12px;opacity:.85;margin-top:8px;cursor:pointer;text-decoration:underline dotted}

  /* ===== Ввод траты ===== */
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
  .input-row{display:flex;gap:8px}
  #expInput{flex:1;padding:10px 12px;font-size:15px;border:2px solid var(--line);border-radius:10px;
    background:var(--bg);color:var(--text);outline:none}
  #expInput:focus{border-color:var(--accent)}
  #addBtn{padding:10px 16px;border:none;border-radius:10px;font-size:15px;font-weight:600;
    background:linear-gradient(135deg,#4E9BF5,#2563EB);color:#fff;cursor:pointer}
  .preview{display:none;margin-top:10px;padding:10px 12px;background:var(--chip);border-radius:10px;
    font-size:14px;align-items:center;gap:8px;flex-wrap:wrap}
  .preview .p-sum{font-weight:700}
  .cat-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip{padding:5px 10px;border-radius:20px;font-size:12px;background:var(--chip);cursor:pointer;
    border:1.5px solid transparent;color:var(--text)}
  .chip.active{border-color:var(--accent);color:var(--accent);background:rgba(61,123,216,.10);font-weight:600}

  /* ===== Статистика ===== */
  h2{font-size:15px;font-weight:700;margin:4px 2px 10px}
  .stat-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .stat-name{font-size:13px;width:32px}
  .stat-bar-wrap{flex:1;height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
  .stat-bar{height:100%;border-radius:4px;transition:width .4s}
  .stat-val{font-size:12px;color:var(--muted);min-width:70px;text-align:right}

  /* ===== История ===== */
  .hist-item{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line)}
  .hist-item:last-child{border-bottom:none}
  .hist-left{display:flex;flex-direction:column;gap:3px}
  .hist-name{font-size:14px;font-weight:600}
  .hist-meta{font-size:11px;color:var(--muted)}
  .hist-sum{font-size:14px;font-weight:700}
  .hist-del{background:none;border:none;font-size:15px;color:var(--muted);cursor:pointer;padding:6px}

  .empty{text-align:center;color:var(--muted);font-size:13px;padding:22px 0}

  /* ===== Шторки настроек ===== */
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;
    padding:16px 16px 26px;z-index:51;transform:translateY(100%);transition:transform .25s;max-width:520px;margin:0 auto}
  .sheet.show{transform:translateY(0)}
  .sheet-title{font-size:15px;font-weight:700;text-align:center;margin-bottom:14px}
  .menu-item{display:flex;justify-content:space-between;align-items:center;padding:13px 10px;
    border-radius:10px;font-size:15px;cursor:pointer}
  .menu-item:active{background:var(--chip)}
  .menu-item .mi-val{color:var(--muted);font-size:13px}
  .sheet-opt{padding:12px 10px;border-radius:10px;font-size:15px;cursor:pointer;display:flex;
    justify-content:space-between;align-items:center}
  .sheet-opt:active{background:var(--chip)}
  .sheet-opt.sel{color:var(--accent);font-weight:600}
  .sheet-opt .check{font-size:15px}
  .back-btn{width:100%;margin-top:10px;padding:11px;border:none;border-radius:10px;background:var(--chip);
    color:var(--text);font-size:14px;cursor:pointer}
</style>
</head>
<body>

<!-- ОНБОРДИНГ -->
<div class="wrap" id="onboard" style="display:none">
  <div class="ob-emoji">👋</div>
  <div class="ob-title">Добро пожаловать!</div>
  <div class="ob-sub">Настроим ваш кошелёк за 20 секунд</div>

  <div class="ob-label">Выберите валюту</div>
  <div id="curGrid"></div>

  <div class="ob-label">Сколько денег у вас на данный момент?</div>
  <input id="balInput" type="number" inputmode="decimal" placeholder="Например, 150000" min="0">
  <div class="ob-hint">С этой суммы мы начнём вести ваш баланс 💰</div>

  <button class="btn-main" onclick="finishOnboard()">Начать →</button>
</div>

<!-- ГЛАВНЫЙ ЭКРАН -->
<div class="wrap" id="main" style="display:none">
  <header>
    <div class="app-name">💸 Траты</div>
    <button id="gearBtn" onclick="openSheet('settings')">⚙️</button>
  </header>

  <div class="balance-card">
    <div class="lbl">Осталось на балансе</div>
    <div id="balanceVal">0</div>
    <div class="sub" onclick="changeBalance()">Нажми, чтобы изменить баланс</div>
  </div>

  <div class="card">
    <div class="input-row">
      <input id="expInput" placeholder="кофе 350">
      <button id="addBtn" onclick="addExpense()">Добавить</button>
    </div>
    <div class="preview" id="preview">
      <span id="pText"></span>
    </div>
    <div class="cat-chips" id="catChips"></div>
  </div>

  <h2>Статистика за месяц</h2>
  <div class="card" id="statBox"></div>

  <h2>История</h2>
  <div class="card" id="histBox"></div>

  <div class="card" style="text-align:center">
    <button class="back-btn" style="margin-top:0" onclick="exportCSV()">↧ Экспорт в CSV</button>
  </div>
</div>

<!-- ШТОРКИ -->
<div class="overlay" id="overlay" onclick="closeSheets()"></div>

<div class="sheet" id="settings">
  <div class="sheet-title">Настройки</div>
  <div class="menu-item" onclick="openSheet('currency')"><span>💱 Валюта</span><span class="mi-val" id="curLabel"></span></div>
  <div class="menu-item" onclick="openSheet('theme')"><span>🌗 Тема</span><span class="mi-val" id="themeLabel"></span></div>
  <button class="back-btn" onclick="closeSheets()">Закрыть</button>
</div>

<div class="sheet" id="currency">
  <div class="sheet-title">Валюта</div>
  <div id="curOptions"></div>
  <button class="back-btn" onclick="openSheet('settings')">‹ Назад</button>
</div>

<div class="sheet" id="theme">
  <div class="sheet-title">Тема</div>
  <div id="themeOptions"></div>
  <button class="back-btn" onclick="openSheet('settings')">‹ Назад</button>
</div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();

/* ===== Данные ===== */
const CATS = [
  {id:'food',   name:'Еда',         emoji:'🍔', color:'#f59e0b', kw:['кофе','чай','еда','обед','ужин','завтрак','пицца','бургер','шаверма','шаурма','кафе','ресторан','продукты','магазин','хлеб','молоко','перекус','снек','вода','сок','лазанья','пельмени','роллы','суши','доставка']},
  {id:'trans',  name:'Транспорт',   emoji:'🚕', color:'#3b82f6', kw:['такси','метро','автобус','маршрутка','трамвай','поезд','бензин','заправка','билет','электричка','каршеринг','самокат','яндекс.такси','inDrive','uber']},
  {id:'shop',   name:'Покупки',     emoji:'🛍️', color:'#ec4899', kw:['одежда','обувь','куртка','футболка','кроссовки','купить','магазин техники','телефон','наушники','альдоне','kaspi','wildberries','ozon','заказ']},
  {id:'fun',    name:'Развлечения', emoji:'🎬', color:'#8b5cf6', kw:['кино','подписка','игра','игры','стим','steam','концерт','караоке','бильярд','боулинг','музей','театр','нетфликс','spotify','яблоко музыка']},
  {id:'health', name:'Здоровье',    emoji:'💊', color:'#10b981', kw:['аптека','лекарство','таблетки','врач','стоматолог','больница','анализы','витамины','маска','бинт']},
  {id:'bills',  name:'Связь и счета',emoji:'📱', color:'#06b6d4', kw:['мтс','билайн','мегафон','тел2','кивi','интернет','связь','связной','пополнение','коммуналка','кварплата','аренда','электричество','вода счёт','газ']},
  {id:'other',  name:'Другое',      emoji:'📦', color:'#6b7280', kw:[]}
];

const CUR = [
  {code:'KZT', sym:'₸', name:'Тенге'},
  {code:'RUB', sym:'₽', name:'Рубль'},
  {code:'UAH', sym:'₴', name:'Гривна'},
  {code:'BYN', sym:'Br', name:'Бел. рубль'},
  {code:'USD', sym:'$', name:'Доллар'},
  {code:'KGS', sym:'сом', name:'Сом'},
  {code:'UZS', sym:'сум', name:'Сум'},
  {code:'AMD', sym:'֏', name:'Драм'}
];

let st = JSON.parse(localStorage.getItem('exp_app_v3') || '{"onboarded":false,"balance":0,"currency":"KZT","theme":"system","expenses":[]}');

function save(){ localStorage.setItem('exp_app_v3', JSON.stringify(st)); }
function curSym(){ return CUR.find(c=>c.code===st.currency).sym; }
function fmt(n){
  const v = Math.round(Number(n)||0);
  const s = Math.abs(v).toLocaleString('ru-RU');
  return (v<0?'−':'') + s + ' ' + curSym();
}
function haptic(type='light'){ tg?.HapticFeedback?.impactOccurred(type); }
function toast(msg){ tg?.showAlert ? tg.showAlert(msg) : alert(msg); }

/* ===== Тема ===== */
function applyTheme(){
  let dark;
  if(st.theme==='dark') dark = true;
  else if(st.theme==='light') dark = false;
  else {
    // системная: Telegram или браузер
    const t = tg?.colorScheme;
    if(t) dark = t==='dark';
    else dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  document.documentElement.dataset.theme = dark?'dark':'light';
  tg?.setHeaderColor?.(dark?'#17212b':'#f2f4f8');
}

/* ===== Онбординг ===== */
function renderOnboardCurrencies(){
  document.getElementById('curGrid').innerHTML = CUR.map(c=>
    `<div class="cur-btn ${c.code===st.currency?'active':''}" onclick="pickOnbCur('${c.code}')">${c.sym}</div>`
  ).join('');
}
function pickOnbCur(code){ haptic(); st.currency = code; save(); renderOnboardCurrencies(); }
function finishOnboard(){
  const v = parseFloat(document.getElementById('balInput').value);
  st.balance = isNaN(v)?0:v;
  st.onboarded = true;
  save(); haptic('medium');
  showMain();
}

/* ===== Главный экран ===== */
function showMain(){
  document.getElementById('onboard').style.display='none';
  document.getElementById('main').style.display='block';
  renderAll();
}

function renderAll(){
  applyTheme();
  document.getElementById('curLabel').textContent = curSym();
  document.getElementById('themeLabel').textContent =
    st.theme==='light'?'Светлая':st.theme==='dark'?'Тёмная':'Системная';

  const bal = st.balance;
  const bv = document.getElementById('balanceVal');
  bv.textContent = fmt(bal);
  bv.classList.toggle('neg', bal<0);

  renderChips();
  renderStats();
  renderHistory();
}

/* ===== Ввод траты ===== */
let draft = null;

function parseExpense(str){
  str = str.trim();
  if(!str) return null;
  const m = str.match(/^([^\d]+?)[\s,:-]*(\d[\d\s.,]*)$|([\d\s.,]+?)[\s,:-]+([^\d]+)$/);
  let name, sum;
  if(m){
    if(m[1]!==undefined){ name = m[1].trim(); sum = m[2]; }
    else { sum = m[3]; name = m[4].trim(); }
  } else {
    const parts = str.split(/\s+/);
    if(parts.length<2) return null;
    const last = parts[parts.length-1];
    const first = parts[0];
    if(/^\d/.test(last)){ sum = last; name = parts.slice(0,-1).join(' '); }
    else if(/\d$/.test(first)){ sum = first; name = parts.slice(1).join(' '); }
    else return null;
  }
  sum = parseFloat(String(sum).replace(/\s/g,'').replace(',','.'));
  if(isNaN(sum) || sum<=0 || !name) return null;
  name = name.charAt(0).toUpperCase()+name.slice(1);
  const low = name.toLowerCase();
  let cat = CATS.find(c=>c.kw.some(k=>low.includes(k))) || CATS[CATS.length-1];
  return {name, sum, cat};
}

function renderChips(){
  const box = document.getElementById('catChips');
  if(draft){
    box.innerHTML = CATS.map(c=>
      `<div class="chip ${c.id===draft.cat.id?'active':''}" onclick="setCat('${c.id}')">${c.emoji} ${c.name}</div>`
    ).join('');
  } else box.innerHTML='';
}

function setCat(id){
  if(!draft) return;
  haptic();
  draft.cat = CATS.find(c=>c.id===id);
  renderChips(); updatePreview();
}

function updatePreview(){
  const pv = document.getElementById('preview');
  const pText = document.getElementById('pText');
  if(draft){
    pv.style.display='flex';
    pText.innerHTML = `Новая трата: <b>${draft.name}</b> — <b class="p-sum">${fmt(draft.sum)}</b> → ${draft.cat.emoji} ${draft.cat.name}`;
  } else {
    pv.style.display='none';
  }
}

document.getElementById('expInput')?.addEventListener('input', e=>{
  draft = parseExpense(e.target.value);
  renderChips(); updatePreview();
});
document.getElementById('expInput')?.addEventListener('keydown', e=>{
  if(e.key==='Enter') addExpense();
});

function addExpense(){
  if(!draft){ toast('Напишите трату, например: кофе 350'); return; }
  st.expenses.unshift({...draft, ts:Date.now()});
  st.balance -= draft.sum;
  save(); haptic('medium');
  draft = null;
  document.getElementById('expInput').value='';
  renderAll();
}

/* ===== Статистика ===== */
function renderStats(){
  const now = new Date();
  const monthExp = st.expenses.filter(e=>{
    const d = new Date(e.ts);
    return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  });
  const box = document.getElementById('statBox');
  if(!monthExp.length){
    box.innerHTML = '<div class="empty">В этом месяце пока пусто ✨</div>';
    return;
  }
  const totals = {};
  monthExp.forEach(e=> totals[e.cat.id]=(totals[e.cat.id]||0)+e.sum);
  const total = Object.values(totals).reduce((a,b)=>a+b,0);
  const max = Math.max(...Object.values(totals));
  box.innerHTML = CATS.filter(c=>totals[c.id]).map(c=>{
    const p = Math.round(totals[c.id]/total*100);
    return `<div class="stat-row">
      <div class="stat-name">${c.emoji}</div>
      <div class="stat-bar-wrap"><div class="stat-bar" style="width:${totals[c.id]/max*100}%;background:${c.color}"></div></div>
      <div class="stat-val">${fmt(totals[c.id])} · ${p}%</div>
    </div>`;
  }).join('');
}

/* ===== История ===== */
function renderHistory(){
  const box = document.getElementById('histBox');
  if(!st.expenses.length){
    box.innerHTML = '<div class="empty">Добавьте первую трату ☝️</div>';
    return;
  }
  box.innerHTML = st.expenses.slice(0,50).map((e,i)=>{
    const d = new Date(e.ts);
    const ds = d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+', '+
      d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
    return `<div class="hist-item">
      <div class="hist-left">
        <div class="hist-name">${e.name}</div>
        <div class="hist-meta">${e.cat.emoji} ${e.cat.name} · ${ds}</div>
      </div>
      <div style="display:flex;align-items:center;gap:4px">
        <div class="hist-sum">−${fmt(e.sum)}</div>
        <button class="hist-del" onclick="delExp(${i})">✕</button>
      </div>
    </div>`;
  }).join('');
}

function delExp(i){
  const e = st.expenses[i];
  st.balance += e.sum;
  st.expenses.splice(i,1);
  save(); haptic('light');
  renderAll();
}

/* ===== Баланс ===== */
function changeBalance(){
  const v = prompt('Новый баланс:', st.balance);
  if(v===null) return;
  const n = parseFloat(String(v).replace(',','.'));
  if(!isNaN(n)){ st.balance = n; save(); renderAll(); haptic('medium'); }
}

/* ===== Шторки ===== */
function openSheet(id){
  haptic('light');
  document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('show'));
  const s = document.getElementById(id);
  s.classList.add('show');
  document.getElementById('overlay').style.display='block';
  requestAnimationFrame(()=>{ document.getElementById('overlay').style.opacity='1'; });
  if(id==='currency') renderCurOptions();
  if(id==='theme') renderThemeOptions();
}
function closeSheets(){
  const ov = document.getElementById('overlay');
  ov.style.opacity='0';
  document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('show'));
  setTimeout(()=>ov.style.display='none',250);
}
function renderCurOptions(){
  document.getElementById('curOptions').innerHTML = CUR.map(c=>
    `<div class="sheet-opt ${c.code===st.currency?'sel':''}" onclick="setCurrency('${c.code}')">
      <span>${c.name} (${c.sym})</span>${c.code===st.currency?'<span class="check">✓</span>':''}
    </div>`).join('');
}
function setCurrency(code){
  st.currency = code; save(); haptic();
  renderCurOptions(); renderAll();
  setTimeout(openSheet.bind(null,'settings'),150);
}
function renderThemeOptions(){
  const opts = [['light','☀️ Светлая'],['dark','🌙 Тёмная'],['system','⚙️ Системная']];
  document.getElementById('themeOptions').innerHTML = opts.map(([k,n])=>
    `<div class="sheet-opt ${st.theme===k?'sel':''}" onclick="setTheme('${k}')">
      <span>${n}</span>${st.theme===k?'<span class="check">✓</span>':''}
    </div>`).join('');
}
function setTheme(t){
  st.theme = t; save(); haptic();
  applyTheme();
  document.getElementById('themeLabel').textContent =
    t==='light'?'Светлая':t==='dark'?'Тёмная':'Системная';
  renderThemeOptions();
  setTimeout(openSheet.bind(null,'settings'),150);
}

/* ===== Экспорт CSV ===== */
function exportCSV(){
  if(!st.expenses.length){ toast('Пока нет трат для экспорта'); return; }
  let csv = '\uFEFFНазвание;Категория;Сумма;Дата\n';
  st.expenses.forEach(e=>{
    const d = new Date(e.ts).toLocaleString('ru-RU');
    csv += `${e.name};${e.cat.name};${e.sum};${d}\n`;
  });
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'expenses.csv';
  a.click();
}
