<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Учёт расходов</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --text:#1c2033; --muted:#8a90a6;
  --accent:#2f6df6; --accent2:#5ea0ff; --line:#e6e9f2; --chipbg:#eef1f8;
  --danger:#e5484d; --shadow:0 8px 24px rgba(30,50,120,.08);
}
body.dark{
  --bg:#14161d; --card:#1e212b; --text:#eef0f6; --muted:#8b90a0;
  --accent:#4a8bff; --accent2:#6ea8ff; --line:#2a2e3a; --chipbg:#262a36;
  --danger:#ff5d5d; --shadow:0 8px 24px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);transition:background .25s,color .25s}
.page{max-width:520px;margin:0 auto;padding:14px 16px 90px}
.hidden{display:none!important}

/* ---------- header ---------- */
.app-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.app-header h1{font-size:20px;font-weight:700}
.icon-btn{width:40px;height:40px;border-radius:12px;border:none;background:var(--card);color:var(--text);font-size:19px;box-shadow:var(--shadow);cursor:pointer}

/* ---------- onboarding ---------- */
.onboard{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px}
.onboard .emoji{font-size:44px;text-align:center;margin-bottom:8px}
.onboard h2{font-size:22px;text-align:center;margin-bottom:6px}
.onboard .sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:22px}
.onboard label{font-size:13px;color:var(--muted);margin:0 0 6px 2px;display:block}
.balance-input{width:100%;padding:9px 14px;font-size:17px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--text);outline:none;margin-bottom:18px}
.balance-input:focus{border-color:var(--accent)}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:10px 0 24px}
.cur-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.cur-btn{padding:8px 2px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.cur-btn .sym{font-size:16px;font-weight:700}
.cur-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(47,109,246,.08)}
.btn{width:100%;padding:14px;border:none;border-radius:14px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:18px}
.btn:active{opacity:.85}

/* ---------- balance card ---------- */
.balance-card{background:linear-gradient(135deg,#5ea0ff 0%,#2f6df6 60%,#1e4fd6 100%);border-radius:18px;padding:20px;color:#fff;box-shadow:0 10px 26px rgba(47,109,246,.35);margin-bottom:16px;cursor:pointer}
.balance-card .lbl{font-size:13px;opacity:.85;margin-bottom:4px}
.balance-card .val{font-size:30px;font-weight:700;letter-spacing:.5px}
.balance-card .val.negative{color:#ffd4d4}
.balance-card .sub{font-size:12px;opacity:.8;margin-top:8px}

/* ---------- input ---------- */
.add-row{display:flex;gap:8px;margin-bottom:10px}
.exp-input{flex:1;padding:13px 14px;font-size:15px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);color:var(--text);outline:none}
.exp-input:focus{border-color:var(--accent)}
.add-btn{width:52px;border:none;border-radius:13px;background:var(--accent);color:#fff;font-size:22px;cursor:pointer}
.preview{background:var(--card);border-radius:13px;padding:10px 12px;margin-bottom:14px;box-shadow:var(--shadow);font-size:14px}
.preview .row1{display:flex;justify-content:space-between;margin-bottom:8px}
.preview .pname{font-weight:600}
.preview .pval{color:var(--accent);font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:0 0 auto;padding:5px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--chipbg);color:var(--text);font-size:12px;cursor:pointer;white-space:nowrap}
.chip.active{border-color:var(--accent);color:var(--accent);font-weight:600}

/* ---------- sections ---------- */
.section-title{font-size:16px;font-weight:700;margin:18px 0 10px}
.stat-item{background:var(--card);border-radius:13px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
.stat-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.stat-top .ic{font-size:16px}
.stat-top .nm{font-size:14px;font-weight:600;flex:1}
.stat-top .sm{font-size:13px;font-weight:700}
.stat-bar{height:6px;border-radius:3px;background:var(--chipbg);overflow:hidden}
.stat-fill{height:100%;border-radius:3px}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:18px 0}

/* ---------- latest ---------- */
.latest-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}
.latest-head .section-title{margin:0}
.arrow-btn{width:36px;height:36px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:17px;cursor:pointer;box-shadow:0 4px 12px rgba(47,109,246,.35)}
.op-item{background:var(--card);border-radius:13px;padding:11px 12px;margin-bottom:8px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
.op-ic{font-size:20px;width:26px;text-align:center}
.op-main{flex:1;min-width:0}
.op-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op-meta{font-size:11px;color:var(--muted)}
.op-amount{font-size:14px;font-weight:700;white-space:nowrap}
.op-del{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px}

/* ---------- history page ---------- */
.hist-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hist-top h2{font-size:19px;flex:1}
.month-nav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:13px;padding:8px 10px;margin-bottom:14px;box-shadow:var(--shadow)}
.month-nav button{border:none;background:var(--chipbg);color:var(--text);width:34px;height:34px;border-radius:10px;font-size:16px;cursor:pointer}
.month-nav .mname{font-size:15px;font-weight:600}
.hist-day{font-size:12px;color:var(--muted);margin:14px 2px 8px;text-transform:capitalize}
.hist-sum{background:var(--card);border-radius:13px;padding:12px;box-shadow:var(--shadow);display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}

/* ---------- sheets ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px 26px}
.sheet h3{font-size:17px;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between}
.sheet .back{font-size:14px;color:var(--accent);background:none;border:none;cursor:pointer;padding:6px 0;margin-bottom:8px}
.sheet .desc{font-size:13px;color:var(--muted);margin-bottom:12px}
.menu-item{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px;border:none;border-radius:13px;background:var(--chipbg);color:var(--text);font-size:15px;cursor:pointer;margin-bottom:8px}
.menu-item .arr{color:var(--muted)}
.theme-opt{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font-size:15px;cursor:pointer;margin-bottom:8px;width:100%}
.theme-opt.active{border-color:var(--accent);color:var(--accent)}
.edit-sheet input{width:100%;padding:12px;font-size:16px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);outline:none;margin:10px 0 4px}
</style>
</head>
<body>

<!-- Онбординг -->
<div class="onboard hidden" id="onboard">
  <div class="emoji">👋</div>
  <h2>Добро пожаловать!</h2>
  <div class="sub">Настроим приложение за 10 секунд</div>
  <label>Выберите валюту</label>
  <div class="cur-grid" id="curGrid"></div>
  <label style="margin-top:16px">Сколько денег у вас на данный момент?</label>
  <input class="balance-input" id="obBalance" type="text" inputmode="decimal" placeholder="Например, 100000">
  <div class="hint">С этой суммы мы начнём вести ваш баланс 💰</div>
  <button class="btn" id="obStart">Начать</button>
</div>

<!-- Основной экран -->
<div class="page hidden" id="app">
  <div class="app-header">
    <h1>Мои расходы</h1>
    <button class="icon-btn" id="gearBtn">⚙️</button>
  </div>

  <div class="balance-card" id="balanceCard">
    <div class="lbl">Осталось на балансе</div>
    <div class="val" id="balanceVal">0</div>
    <div class="sub" id="balanceSub">Нажми, чтобы изменить баланс</div>
  </div>

  <div class="add-row">
    <input class="exp-input" id="expInput" placeholder="кофе 350" autocomplete="off">
    <button class="add-btn" id="addBtn">＋</button>
  </div>
  <div class="preview hidden" id="preview">
    <div class="row1"><span class="pname" id="pName"></span><span class="pval" id="pVal"></span></div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="section-title">Статистика за месяц</div>
  <div id="stats"></div>

  <div class="latest-head">
    <div class="section-title">Последние операции</div>
    <button class="arrow-btn" id="toHistory">→</button>
  </div>
  <div id="latest"></div>
</div>

<!-- Страница истории -->
<div class="page hidden" id="histPage">
  <div class="hist-top">
    <button class="icon-btn" id="backBtn">←</button>
    <h2>История</h2>
  </div>
  <div class="month-nav">
    <button id="mPrev">‹</button>
    <span class="mname" id="mName"></span>
    <button id="mNext">›</button>
  </div>
  <div id="histSum"></div>
  <div id="histList"></div>
</div>

<!-- Шторки -->
<div class="overlay hidden" id="overlay">
  <div class="sheet" id="sheetRoot"></div>
</div>

function haptic(){ try{ TELEGRAM && TELEGRAM.HapticFeedback && TELEGRAM.HapticFeedback.impactOccurred('light'); }catch(e){} }

/* ---------- состояние ---------- */
let S = loadState();
function loadState(){
  try{
    const raw = localStorage.getItem('expense_app_v1');
    if (raw) return JSON.parse(raw);
  }catch(e){}
  return { onboarded:false, balance:0, currency:"KZT", theme:"system", expenses:[], prevCat:null };
}
function save(){ localStorage.setItem('expense_app_v1', JSON.stringify(S)); }

/* ---------- тема ---------- */
function applyTheme(){
  let dark;
  if (S.theme === 'dark') dark = true;
  else if (S.theme === 'light') dark = false;
  else {
    if (TELEGRAM && TELEGRAM.colorScheme) dark = TELEGRAM.colorScheme === 'dark';
    else dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  document.body.classList.toggle('dark', dark);
}
if (TELEGRAM) TELEGRAM.onEvent('themeChanged', applyTheme);

/* ---------- валюта ---------- */
function curSym(){ const c = CURRENCIES.find(x=>x[0]===S.currency); return c ? c[1] : ''; }
function fmt(n){
  const neg = n < 0;
  const v = Math.abs(Math.round(n*100)/100).toLocaleString('ru-RU');
  return (neg?'−':'') + v + ' ' + curSym();
}

/* ---------- парсер ---------- */
function parseInput(text){
  text = text.trim();
  if (!text) return null;
  const m = text.match(/(\d+(?:[.,]\d+)?)/g);
  if (!m) return null;
  const amount = parseFloat(m[m.length-1].replace(',','.'));
  if (!amount || amount <= 0) return null;
  let name = text.replace(m[m.length-1], '').replace(/₸|₽|₴|\$|Br|сом|тенге|руб|kzt|rub|usd/gi,'').trim();
  if (!name) return null;
  return { name: name.charAt(0).toUpperCase()+name.slice(1), amount, cat: guessCategory(name) };
}

function guessCategory(raw){
  const text = ' ' + raw.toLowerCase().replace(/ё/g,'е') + ' ';
  let best = {id:'other', score:0};
  for (const id in PHRASES){
    for (const p of PHRASES[id]){
      if (text.includes(' '+p+' ') || text.includes(' '+p)) {
        if (2 > best.score) best = {id, score:2};
      }
    }
  }
  for (const id in KW){
    for (const w of KW[id]){
      if (text.includes(' '+w+' ') && 1 > best.score) best = {id, score:1};
    }
  }
  return best.id;
}

/* ---------- рендер ---------- */
const $ = id => document.getElementById(id);

function renderAll(){ renderBalance(); renderStats(); renderLatest(); }

function renderBalance(){
  const el = $('balanceVal');
  el.textContent = fmt(S.balance);
  el.classList.toggle('negative', S.balance < 0);
}

function monthKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function thisMonthExpenses(){
  const now = monthKey(new Date());
  return S.expenses.filter(e => monthKey(new Date(e.ts)) === now);
}

function renderStats(){
  const box = $('stats');
  const list = thisMonthExpenses();
  if (!list.length){ box.innerHTML = '<div class="empty">Пока нет трат в этом месяце</div>'; return; }
  const total = list.reduce((s,e)=>s+e.amount,0);
  const byCat = {};
  list.forEach(e => byCat[e.cat] = (byCat[e.cat]||0)+e.amount);
  const rows = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  box.innerHTML = rows.map(([id,sum])=>{
    const c = CAT_MAP[id] || CAT_MAP.other;
    const pct = Math.round(sum/total*100);
    return '<div class="stat-item"><div class="stat-top"><span class="ic">'+c.emoji+'</span><span class="nm">'+c.name+'</span><span class="sm">'+fmt(sum)+' · '+pct+'%</span></div><div class="stat-bar"><div class="stat-fill" style="width:'+pct+'%;background:'+c.color+'"></div></div></div>';
  }).join('');
}

function opHTML(e){
  const c = CAT_MAP[e.cat] || CAT_MAP.other;
  const d = new Date(e.ts);
  const time = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  return '<div class="op-item"><span class="op-ic">'+c.emoji+'</span><div class="op-main"><div class="op-name">'+esc(e.name)+'</div><div class="op-meta">'+c.name+' · '+time+'</div></div><span class="op-amount">−'+fmt(e.amount)+'</span><button class="op-del" data-del="'+e.id+'">✕</button></div>';
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderLatest(){
  const box = $('latest');
  const list = S.expenses.slice().sort((a,b)=>b.ts-a.ts).slice(0,2);
  box.innerHTML = list.length ? list.map(opHTML).join('') : '<div class="empty">Здесь появятся ваши траты</div>';
  box.querySelectorAll('[data-del]').forEach(b=>{
    b.onclick = () => { haptic(); delExpense(b.dataset.del); };
  });
}

/* ---------- ввод ---------- */
let pendingCat = null;
$('expInput').addEventListener('input', e=>{
  const p = parseInput(e.target.value);
  if (p){
    if (pendingCat === null) pendingCat = p.cat;
    if (p.name !== lastParsed) pendingCat = p.cat;
    lastParsed = p.name;
    showPreview(p);
  } else { $('preview').classList.add('hidden'); pendingCat = null; lastParsed = null; }
});
let lastParsed = null;

function showPreview(p){
  $('preview').classList.remove('hidden');
  $('pName').textContent = p.name;
  $('pVal').textContent = '−' + fmt(p.amount);
  $('chips').innerHTML = CATS.map(c=>'<button class="chip'+(c.id===pendingCat?' active':'')+'" data-cat="'+c.id+'">'+c.emoji+' '+c.name+'</button>').join('');
  $('chips').querySelectorAll('[data-cat]').forEach(ch=>{
    ch.onclick = () => { haptic(); pendingCat = ch.dataset.cat; showPreview(parseInput($('expInput').value)); };
  });
}

$('addBtn').onclick = addExpense;
$('expInput').addEventListener('keydown', e=>{ if (e.key==='Enter') addExpense(); });
function addExpense(){
  const p = parseInput($('expInput').value);
  if (!p){ haptic(); return; }
  const e = { id: Date.now()+''+Math.floor(Math.random()*1000), name: p.name, amount: p.amount, cat: pendingCat || p.cat, ts: Date.now() };
  S.expenses.push(e);
  S.balance -= e.amount;
  save(); haptic();
  $('expInput').value = ''; $('preview').classList.add('hidden');
  pendingCat = null; lastParsed = null;
  renderAll();
}

function delExpense(id){
  const i = S.expenses.findIndex(e=>e.id===id);
  if (i<0) return;
  S.balance += S.expenses[i].amount;
  S.expenses.splice(i,1);
  save(); renderAll(); renderHistory();
}

/* ---------- баланс ---------- */
$('balanceCard').onclick = openEditBalance;

  openSheet('<h3>Изменить баланс</h3><div class="desc">Введите новую сумму — она заменит текущий баланс</div><input id="balInput" type="text" inputmode="decimal" placeholder="'+fmt(S.balance)+'"><button class="btn" id="balSave">Сохранить</button>');
  $('balSave').onclick = ()=>{
    const v = parseFloat(($('balInput').value||'').replace(/\s/g,'').replace(',','.'));

    closeSheet();

}

/* ---------- история ---------- */
let histMonth = new Date();
$('toHistory').onclick = ()=>{ haptic(); histMonth = new Date(); showPage('hist'); };
$('backBtn').onclick = ()=> showPage('app');
function showPage(p){
  $('app').classList.toggle('hidden', p!=='app');
  $('histPage').classList.toggle('hidden', p!=='hist');
  if (p==='hist') renderHistory();
}
$('mPrev').onclick = ()=>{ histMonth.setMonth(histMonth.getMonth()-1); haptic(); renderHistory(); };
$('mNext').onclick = ()=>{ histMonth.setMonth(histMonth.getMonth()+1); haptic(); renderHistory(); };

const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function renderHistory(){
  $('mName').textContent = MONTHS[histMonth.getMonth()]+' '+histMonth.getFullYear();
  const key = monthKey(histMonth);
  const list = S.expenses.filter(e=>monthKey(new Date(e.ts))===key).sort((a,b)=>b.ts-a.ts);
  const total = list.reduce((s,e)=>s+e.amount,0);
  $('histSum').innerHTML = '<div class="hist-sum"><span>Всего за месяц</span><b>'+fmt(total)+'</b></div>';
  if (!list.length){ $('histList').innerHTML = '<div class="empty">Нет операций за этот месяц</div>'; return; }
  const groups = {};
  list.forEach(e=>{ groups[new Date(e.ts).toDateString()] = (groups[new Date(e.ts).toDateString()]||[]).concat(e); });
  const today = new Date().toDateString();
  const yest = new Date(Date.now()-86400000).toDateString();
  let html = '';
  for (const day in groups){
    const d = new Date(day);
    const label = day===today ? 'Сегодня' : day===yest ? 'Вчера' : d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
    html += '<div class="hist-day">'+label+'</div>' + groups[day].map(opHTML).join('');
  }
  $('histList').innerHTML = html;
  $('histList').querySelectorAll('[data-del]').forEach(b=>{
    b.onclick = ()=>{ haptic(); delExpense(b.dataset.del); };
  });
}

/* ---------- онбординг ---------- */
let obCur = 'KZT';
function renderObCurrencies(){
  $('curGrid').innerHTML = CURRENCIES.map(c=>'<button class="cur-btn'+(c[0]===obCur?' active':'')+'" data-cur="'+c[0]+'"><span class="sym">'+c[1]+'</span><span>'+c[2]+'</span></button>').join('');
  $('curGrid').querySelectorAll('[data-cur]').forEach(b=>{
    b.onclick = ()=>{ obCur = b.dataset.cur; haptic(); renderObCurrencies(); };

}
$('obStart').onclick = ()=>{
  const v = parseFloat(($('obBalance').value||'0').replace(/\s/g,'').replace(',','.'));
  S.balance = isNaN(v) ? 0 : v;
  S.currency = obCur;
  S.onboarded = true;

};
function enterApp(){
  $('onboard').classList.toggle('hidden', S.onboarded);
  $('app').classList.toggle('hidden', !S.onboarded);
