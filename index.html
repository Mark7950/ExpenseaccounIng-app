<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Кошелёк</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;transition:background .2s,color .2s;padding-bottom:40px}
body.light{--bg:#f2f2f7;--card:#ffffff;--text:#000000;--muted:#8e8e93;--border:rgba(0,0,0,.08);--chipbg:rgba(0,0,0,.05);--inputbg:rgba(0,0,0,.05);--shadow:0 2px 12px rgba(0,0,0,.06)}
body.dark{--bg:#0f0f0f;--card:#1c1c1e;--text:#ffffff;--muted:#98989e;--border:rgba(255,255,255,.1);--chipbg:rgba(255,255,255,.08);--inputbg:rgba(255,255,255,.08);--shadow:0 2px 12px rgba(0,0,0,.4)}
.wrap{max-width:520px;margin:0 auto;padding:16px}
.hidden{display:none!important}

/* ===== шапка ===== */
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
header h1{font-size:22px;font-weight:700}
.iconbtn{width:40px;height:40px;border-radius:12px;border:none;background:var(--card);color:var(--text);font-size:18px;cursor:pointer;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.iconbtn:active{transform:scale(.92)}

/* ===== карточка баланса ===== */
.balcard{border-radius:20px;padding:22px 20px;color:#fff;background:linear-gradient(135deg,#ff9500,#ff5e3a);box-shadow:0 8px 24px rgba(255,94,58,.35);margin-bottom:16px}
.balcard .label{font-size:13px;opacity:.85;margin-bottom:6px}
.balcard .value{font-size:34px;font-weight:800;letter-spacing:-.5px;word-break:break-all}
.balcard .value.neg{color:#ffd7cc}
.balcard .sub{font-size:13px;opacity:.85;margin-top:8px}
.balcard .edit{margin-top:12px;background:rgba(255,255,255,.2);border:none;color:#fff;font-size:13px;padding:8px 14px;border-radius:20px;cursor:pointer}
.balcard .edit:active{background:rgba(255,255,255,.35)}

/* ===== ввод траты ===== */
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.inputrow{display:flex;gap:8px}
input[type=text]{flex:1;background:var(--inputbg);border:1px solid transparent;border-radius:12px;padding:13px 14px;font-size:16px;color:var(--text);outline:none;transition:border .2s}
input[type=text]:focus{border-color:#ff9500}
input::placeholder{color:var(--muted)}
.addbtn{background:linear-gradient(135deg,#ff9500,#ff5e3a);color:#fff;border:none;border-radius:12px;width:52px;font-size:22px;cursor:pointer;flex-shrink:0}
.addbtn:active{transform:scale(.94)}
.preview{margin-top:10px;display:none;align-items:center;gap:8px;font-size:14px}
.preview.show{display:flex}
.preview .pv-cat{background:var(--chipbg);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:13px;border:1px solid var(--border)}
.preview .pv-sum{font-weight:700}
.hint{font-size:12px;color:var(--muted);margin-top:8px}

/* ===== статистика ===== */
.sectiontitle{font-size:15px;font-weight:700;margin:20px 0 10px}
.statrow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.statrow .s-emoji{font-size:20px;width:26px;text-align:center}
.statrow .s-main{flex:1;min-width:0}
.statrow .s-top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.statrow .s-top .s-name{color:var(--text)}
.statrow .s-top .s-sum{font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--chipbg);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#ff9500,#ff5e3a)}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:14px 0}

/* ===== история ===== */
.daylabel{font-size:12px;color:var(--muted);margin:14px 0 8px;text-transform:uppercase;letter-spacing:.4px}
.expitem{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:8px}
.expitem .e-emoji{font-size:22px}
.expitem .e-main{flex:1;min-width:0}
.expitem .e-name{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.expitem .e-cat{font-size:12px;margin-top:2px}
.expitem .e-sum{font-weight:700;font-size:15px;white-space:nowrap}
.expitem .e-del{border:none;background:var(--chipbg);color:var(--muted);width:30px;height:30px;border-radius:10px;font-size:15px;cursor:pointer;flex-shrink:0}
.expitem .e-del:active{transform:scale(.9)}
.cat-eat{color:#ff9500}.cat-tr{color:#3478f6}.cat-hl{color:#34c759}.cat-fun{color:#af52de}.cat-ph{color:#5ac8fa}.cat-ho{color:#ff6482}.cat-cl{color:#a2845e}.cat-ot{color:var(--muted)}

/* ===== меню-шторка ===== */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:20px 20px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);z-index:51;max-width:520px;margin:0 auto}
.sheet.show{transform:translateY(0)}
.sheet .grip{width:36px;height:4px;border-radius:2px;background:var(--chipbg);margin:0 auto 16px}
.sheet h3{font-size:17px;font-weight:700;text-align:center;margin-bottom:16px}
.menuitem{display:flex;align-items:center;justify-content:space-between;background:var(--chipbg);border-radius:14px;padding:15px 16px;font-size:16px;cursor:pointer;margin-bottom:10px;border:none;color:var(--text);width:100%;text-align:left}
.menuitem:active{transform:scale(.98)}
.menuitem .mi-left{display:flex;align-items:center;gap:12px}
.menuitem .mi-val{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:6px}
.optgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.opt{background:var(--chipbg);border:2px solid transparent;border-radius:14px;padding:14px 6px;text-align:center;font-size:14px;cursor:pointer;color:var(--text)}
.opt b{display:block;font-size:24px;margin-bottom:4px}
.opt.sel{border-color:#ff9500;background:rgba(255,149,0,.1)}
.opt:active{transform:scale(.95)}
.backbtn{background:none;border:none;color:#ff9500;font-size:15px;cursor:pointer;padding:6px 0;margin-bottom:8px}
.sheet .btn-primary{width:100%;background:linear-gradient(135deg,#ff9500,#ff5e3a);color:#fff;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:600;cursor:pointer;margin-top:6px}
.sheet .btn-primary:active{transform:scale(.98)}
.sheet input[type=text]{width:100%;font-size:20px;text-align:center;margin-top:4px}

/* ===== онбординг ===== */
#onboarding{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 24px;max-width:520px;margin:0 auto}
#onboarding .wave{font-size:52px;text-align:center;margin-bottom:16px}
#onboarding h2{font-size:26px;font-weight:800;text-align:center;margin-bottom:8px}
#onboarding .sub{text-align:center;color:var(--muted);font-size:15px;margin-bottom:28px}
.curgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}
.cur{background:var(--card);border:2px solid transparent;border-radius:14px;padding:14px 4px;text-align:center;cursor:pointer;box-shadow:var(--shadow);color:var(--text)}
.cur b{display:block;font-size:24px;margin-bottom:4px}
.cur span{font-size:12px;color:var(--muted)}
.cur.sel{border-color:#ff9500;background:rgba(255,149,0,.1)}
#onboarding .phrase{text-align:center;font-size:14px;color:var(--muted);margin:18px 0 24px}
#onboarding .btn-primary{width:100%;background:linear-gradient(135deg,#ff9500,#ff5e3a);color:#fff;border:none;border-radius:16px;padding:16px;font-size:17px;font-weight:600;cursor:pointer;box-shadow:0 8px 20px rgba(255,94,58,.35)}
#onboarding .btn-primary:active{transform:scale(.98)}
.olonb{background:var(--inputbg);border:2px solid transparent;border-radius:14px;padding:14px;font-size:22px;text-align:center;color:var(--text);outline:none;width:100%}
.olonb:focus{border-color:#ff9500}
label.olabel{display:block;font-size:13px;color:var(--muted);margin:0 0 8px 4px}
</style>
</head>
<body class="light">

<!-- ОНБОРДИНГ -->
<div id="onboarding" class="hidden">
  <div class="wave">👋</div>
  <h2>Добро пожаловать!</h2>
  <p class="sub">Давай настроим твой кошелёк</p>
  <label class="olabel">Выбери валюту</label>
  <div class="curgrid" id="curgridOnb"></div>
  <label class="olabel">Сколько денег у тебя на данный момент?</label>
  <input type="text" class="olonb" id="onbBalance" inputmode="decimal" placeholder="0">
  <p class="phrase">С этой суммы мы начнём вести твой баланс 💰</p>
  <button class="btn-primary" id="onbStart">Начать</button>
</div>

<!-- ОСНОВНОЙ ЭКРАН -->
<div id="app" class="wrap hidden">
  <header>
    <div class="iconbtn" id="exportBtn" title="Экспорт CSV">↧</div>
    <h1>Кошелёк</h1>
    <div class="iconbtn" id="settingsBtn" title="Настройки">⚙</div>
  </header>

  <div class="balcard">
    <div class="label">Осталось на балансе</div>
    <div class="value" id="balValue">0</div>
    <div class="sub" id="balSub"></div>
    <button class="edit" id="editBalBtn">Изменить баланс</button>
  </div>

  <div class="card">
    <div class="inputrow">
      <input type="text" id="expInput" placeholder="кофе 350" inputmode="text">
      <button class="addbtn" id="addBtn">＋</button>
    </div>
    <div class="preview" id="preview">
      <span class="pv-cat" id="pvCat"></span>
      <span class="pv-sum" id="pvSum"></span>
    </div>
    <div class="hint">Например: «кофе 350» или «такси 1200». Категорию можно тапнуть и поменять.</div>
  </div>

  <div class="sectiontitle">Расходы за месяц</div>
  <div class="card" id="statsBox"></div>

  <div class="sectiontitle">История</div>
  <div id="historyBox"></div>
</div>

<!-- ШТОРКИ -->
<div class="overlay" id="overlay"></div>
<div class="sheet" id="menuSheet">
  <div class="grip"></div>
  <h3>Настройки</h3>
  <button class="menuitem" id="miCurrency">
    <span class="mi-left">💱 Валюта</span>
    <span class="mi-val" id="miCurVal"></span>
  </button>
  <button class="menuitem" id="miTheme">
    <span class="mi-left">🌗 Тема</span>
    <span class="mi-val" id="miThemeVal"></span>
  </button>
</div>
<div class="sheet" id="curSheet">
  <div class="grip"></div>
  <button class="backbtn">‹ Назад</button>
  <h3>Выбери валюту</h3>
  <div class="optgrid" id="curgridSet"></div>
</div>
<div class="sheet" id="themeSheet">
  <div class="grip"></div>
  <button class="backbtn">‹ Назад</button>
  <h3>Тема приложения</h3>
  <div class="optgrid" id="themegrid" style="grid-template-columns:repeat(3,1fr)"></div>
</div>
<div class="sheet" id="balSheet">
  <div class="grip"></div>
  <h3>Новый баланс</h3>
  <input type="text" class="olonb" id="balInput" inputmode="decimal" placeholder="0">
  <button class="btn-primary" id="balSave">Сохранить</button>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

/* ---------- хранилище ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

/* ---------- валюты ---------- */
const CURRENCIES = [
  { code:'KZT', sym:'₸', name:'Тенге' },
  { code:'RUB', sym:'₽', name:'Рубль' },
  { code:'UAH', sym:'₴', name:'Гривна' },
  { code:'BYN', sym:'Br', name:'Бел. рубль' },
  { code:'USD', sym:'$',  name:'Доллар' },
  { code:'KGS', sym:'с',  name:'Сом' },
  { code:'UZS', sym:'сум',name:'Сум' },
  { code:'AMD', sym:'֏',  name:'Драм' }
];
let currency = store.get('cur', 'KZT');
const curObj = () => CURRENCIES.find(c => c.code === currency) || CURRENCIES[0];

/* ---------- категории ---------- */
const CATS = [
  { id:'eat', emoji:'🍔', name:'Еда',          kw:['кофе','чай','обед','ужин','завтрак','еда','ресторан','кафе','пицца','шаурма','бургер','перекус','ланч','фастфуд','снек','десерт','торт','пицца','роллы','суши','дошик','завтрак'] },
  { id:'tr',  emoji:'🚌', name:'Транспорт',    kw:['такси','метро','автобус','маршрут','троллейбус','трамвай','поезд','поездка','бензин','заправка','проезд','билет','uber','яндекс','yandex','транспорт','путешествие'] },
  { id:'hl',  emoji:'💊', name:'Здоровье',     kw:['аптека','лекарство','таблетки','врач','больница','клиника','анализы','витамины','маска','здоровье'] },
  { id:'fun', emoji:'🎬', name:'Развлечения',  kw:['кино','игра','игры','подписка','spotify','нетфликс','netflix','steam','билеты','концерт','развлечения','клуб','бар','караоке','боулинг'] },
  { id:'ph',  emoji:'📱', name:'Связь',        kw:['мтс','билайн','мегафон','tele2','теле2','алтел','актив','kcell','beeline','пополнение','интернет','связь','баланс','минуты','гигабайты'] },
  { id:'ho',  emoji:'🏠', name:'Жильё',        kw:['аренда','квартплата','коммуналка','коммунальные','электричество','свет','вода','газ','отопление','мусор','ремонт','мебель'] },
  { id:'cl',  emoji:'👕', name:'Одежда',       kw:['одежда','кроссовки','кеды','футболка','джинсы','куртка','ботинки','носки','ремень','шапка','перчатки','зарядка','наушники','чехол'] },
  { id:'ot',  emoji:'📦', name:'Другое',       kw:[] }
];
const catById = id => CATS.find(c => c.id === id) || CATS[CATS.length-1];
function guessCat(name){
  const n = name.toLowerCase();
  for (const c of CATS) for (const k of c.kw) if (n.includes(k)) return c.id;
  return 'ot';
}

/* ---------- парсер ввода ---------- */
function parseInput(text){
  const m = text.match(/-?\d[\d\s.,]*/);
  let name = text, amount = 0;
  if (m){
    const raw = m[0].replace(/\s/g,'').replace(',', '.');
    amount = Math.abs(parseFloat(raw)) || 0;
    name = (text.slice(0, m.index) + text.slice(m.index + m[0].length)).trim();
  }
  if (!name) name = 'Без названия';
  return { name, amount };
}

/* ---------- состояние ---------- */
let onboarded = store.get('onb', false);
let balance   = store.get('balance', 0);
let expenses  = store.get('expenses', []);
let pendingCat = null;

const fmt = n => new Intl.NumberFormat('ru-RU', {maximumFractionDigits:2}).format(n) + ' ' + curObj().sym;
function haptic(){ try { tg && tg.HapticFeedback.impactOccurred('light'); } catch(e){} }

/* ---------- тема ---------- */
function applyTheme(){
  const pref = store.get('theme', 'system');
  let dark;
  if (pref === 'system') dark = (tg && tg.colorScheme === 'dark') || (!tg && window.matchMedia('(prefers-color-scheme: dark)').matches);
  else dark = pref === 'dark';
  document.body.classList.toggle('dark', dark);
}
if (tg) tg.onEvent('themeChanged', applyTheme);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (store.get('theme','system')==='system') applyTheme(); });

/* ---------- сетки выбора ---------- */
function buildCurGrid(el, onPick){
  el.innerHTML = '';
  CURRENCIES.forEach(c => {
    const b = document.createElement('div');
    b.className = 'cur' + (c.code === currency ? ' sel' : '');
    b.innerHTML = '<b>' + c.sym + '</b><span>' + c.name + '</span>';
    b.onclick = () => { haptic(); onPick(c.code); };
    el.appendChild(b);
  });
}
function buildThemeGrid(){
  const el = document.getElementById('themegrid');
  el.innerHTML = '';
  [['light','☀️','Светлая'],['dark','🌙','Тёмная'],['system','⚙','Системная']].forEach(([id,ic,name]) => {
    const pref = store.get('theme','system');
    const b = document.createElement('div');
    b.className = 'opt' + (pref === id ? ' sel' : '');
    b.innerHTML = '<b>' + ic + '</b>' + name;
    b.onclick = () => { haptic(); store.set('theme', id); applyTheme(); buildThemeGrid(); updateMenuVals(); };
    el.appendChild(b);
  });
}

/* ---------- шторки ---------- */
const overlay = document.getElementById('overlay');
const sheets = ['menuSheet','curSheet','themeSheet','balSheet'];
function openSheet(id){
  overlay.classList.add('show');
  sheets.forEach(s => document.getElementById(s).classList.remove('show'));
  document.getElementById(id).classList.add('show');
  if (id === 'curSheet') buildCurGrid(document.getElementById('curgridSet'), code => {
    currency = code; store.set('cur', code);
    updateMenuVals(); renderAll(); closeSheets();
  });
  if (id === 'themeSheet') buildThemeGrid();
}
function closeSheets(){
  overlay.classList.remove('show');
  sheets.forEach(s => document.getElementById(s).classList.remove('show'));
}
overlay.onclick = closeSheets;
document.querySelectorAll('.backbtn').forEach(b => b.onclick = () => openSheet('menuSheet'));

document.getElementById('settingsBtn').onclick = () => { haptic(); openSheet('menuSheet'); };
document.getElementById('miCurrency').onclick  = () => { haptic(); openSheet('curSheet'); };
document.getElementById('miTheme').onclick     = () => { haptic(); openSheet('themeSheet'); };
document.getElementById('miCurVal').textContent = curObj().sym + ' ' + curObj().name;
function updateMenuVals(){
  document.getElementById('miCurVal').textContent = curObj().sym + ' ' + curObj().name;
  document.getElementById('miThemeVal').textContent =
    { light:'Светлая', dark:'Тёмная', system:'Системная' }[store.get('theme','system')];
}

/* ---------- онбординг ---------- */
function renderOnbCur(){
  buildCurGrid(document.getElementById('curgridOnb'), code => {
    currency = code; store.set('cur', code);
    renderOnbCur();
    document.getElementById('onbBalance').placeholder = '0 ' + curObj().sym;
  });
}
renderOnbCur();
document.getElementById('onbBalance').placeholder = '0 ' + curObj().sym;

document.getElementById('onbStart').onclick = () => {
  const v = parseFloat(String(document.getElementById('onbBalance').value).replace(/\s/g,'').replace(',','.')) || 0;
  balance = v;
  store.set('balance', v);
  store.set('onb', true);
  haptic();
  showApp();
};
function showApp(){
  document.getElementById('onboarding').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  renderAll();
}

/* ---------- изменение баланса ---------- */
document.getElementById('editBalBtn').onclick = () => {
  haptic();
  document.getElementById('balInput').value = '';
  openSheet('balSheet');
};
document.getElementById('balSave').onclick = () => {
  const v = parseFloat(String(document.getElementById('balInput').value).replace(/\s/g,'').replace(',','.')) || 0;
  balance = v; store.set('balance', v); closeSheets(); renderAll();
};
document.getElementById('balInput').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('balSave').click(); });

/* ---------- добавление траты ---------- */
const expInput = document.getElementById('expInput');
const preview = document.getElementById('preview');
expInput.addEventListener('input', () => {
  const t = expInput.value.trim();
  if (!t){ preview.classList.remove('show'); pendingCat = null; return; }
  const { name, amount } = parseInput(t);
  const cid = pendingCat || guessCat(name);
  const c = catById(cid);
  document.getElementById('pvCat').textContent = c.emoji + ' ' + c.name;
  document.getElementById('pvSum').textContent = fmt(amount);
  preview.classList.add('show');
});
document.getElementById('pvCat').onclick = () => {
  haptic();
  const idx = CATS.findIndex(c => c.id === (pendingCat || guessCat(parseInput(expInput.value).name)));
  pendingCat = CATS[(idx + 1) % CATS.length].id;
  const c = catById(pendingCat);
  document.getElementById('pvCat').textContent = c.emoji + ' ' + c.name;
};
function addExpense(){
  const t = expInput.value.trim();
  if (!t) return;
  const { name, amount } = parseInput(t);
  const cid = pendingCat || guessCat(name);
  expenses.unshift({ name, amount, cat: cid, ts: Date.now() });
  balance -= amount;
  store.set('expenses', expenses);
  store.set('balance', balance);
  expInput.value = ''; pendingCat = null; preview.classList.remove('show');
  haptic();
  renderAll();
}
document.getElementById('addBtn').onclick = addExpense;
expInput.addEventListener('keydown', e => { if (e.key === 'Enter') addExpense(); });

/* ---------- удаление ---------- */
function delExp(i){
  balance += expenses[i].amount;
  expenses.splice(i, 1);
  store.set('expenses', expenses);
  store.set('balance', balance);
  haptic();
  renderAll();
}

/* ---------- отрисовка ---------- */
function renderAll(){
  updateMenuVals();
  const bv = document.getElementById('balValue');
  bv.textContent = fmt(balance);
  bv.classList.toggle('neg', balance < 0);
  const now = new Date();
  const monthExp = expenses.filter(e => { const d = new Date(e.ts); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); });
  const spent = monthExp.reduce((s,e) => s + e.amount, 0);
  document.getElementById('balSub').textContent = 'Потрачено за месяц: ' + fmt(spent);

  /* статистика */
  const sb = document.getElementById('statsBox');
  const byCat = {};
  monthExp.forEach(e => byCat[e.cat] = (byCat[e.cat] || 0) + e.amount);
  const entries = Object.entries(byCat).sort((a,b) => b[1] - a[1]);
  if (!entries.length) sb.innerHTML = '<div class="empty">Пока нет расходов в этом месяце</div>';
  else {
    sb.innerHTML = '';
    entries.forEach(([cid, sum]) => {
      const c = catById(cid);
      const pct = Math.round(sum / spent * 100);
      const row = document.createElement('div');
      row.className = 'statrow';
      row.innerHTML = '<div class="s-emoji">' + c.emoji + '</div><div class="s-main"><div class="s-top"><span class="s-name">' + c.name + ' · ' + pct + '%</span><span class="s-sum">' + fmt(sum) + '</span></div><div class="bar"><i style="width:' + pct + '%"></i></div></div>';
      sb.appendChild(row);
    });
  }

  /* история */
  const hb = document.getElementById('historyBox');
  if (!expenses.length){ hb.innerHTML = '<div class="card empty">Добавь первую трату выше ☝</div>'; return; }
  hb.innerHTML = '';
  const days = {};
  expenses.forEach(e => {
    const d = new Date(e.ts);
    const key = d.toDateString();
    (days[key] = days[key] || []).push(e);
  });
  Object.entries(days).forEach(([key, list]) => {
    const lbl = document.createElement('div');
    const d = new Date(list[0].ts);
    const today = new Date().toDateString() === key;
    const yest = new Date(Date.now() - 864e5).toDateString() === key;
    lbl.className = 'daylabel';
    lbl.textContent = today ? 'Сегодня' : yest ? 'Вчера' : d.toLocaleDateString('ru-RU', { day:'numeric', month:'long' });
    hb.appendChild(lbl);
    list.forEach(e => {
      const c = catById(e.cat);
      const it = document.createElement('div');
      it.className = 'expitem';
      it.innerHTML = '<div class="e-emoji">' + c.emoji + '</div><div class="e-main"><div class="e-name">' + e.name.replace(/</g,'&lt;') + '</div><div class="e-cat cat-' + c.id + '">' + c.name + '</div></div><div class="e-sum">−' + fmt(e.amount) + '</div>';
      const del = document.createElement('button');
      del.className = 'e-del'; del.textContent = '✕';
      del.onclick = () => delExp(expenses.indexOf(e));
      it.appendChild(del);
      hb.appendChild(it);
    });
  });
}

/* ---------- CSV ---------- */
document.getElementById('exportBtn').onclick = () => {
  let csv = '\uFEFFДата;Название;Категория;Сумма;Валюта\n';
  [...expenses].reverse().forEach(e => {
    const d = new Date(e.ts).toLocaleString('ru-RU');
    csv += [d, e.name.replace(/;/g,','), catById(e.cat).name, e.amount, currency].join(';') + '\n';
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' }));
  a.download = 'expenses.csv';
  a.click();
  haptic();
};

/* ---------- старт ---------- */
applyTheme();
if (onboarded) showApp();
else document.getElementById('onboarding').classList.remove('hidden');
</script>
</body>
