<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Мои расходы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #f2f2f7; --card: #ffffff; --text: #1c1c1e; --sub: #8e8e93;
    --accent: #ff9f0a; --accent2: #ffb340; --danger: #ff3b30;
    --chip-bg: #f0f0f5; --input-bg: #ffffff; --sep: rgba(60,60,67,.12);
    --shadow: 0 2px 12px rgba(0,0,0,.07);
  }
  html.dark {
    --bg: #1c1c1e; --card: #2c2c2e; --text: #ffffff; --sub: #98989f;
    --chip-bg: #3a3a3c; --input-bg: #2c2c2e; --sep: rgba(84,84,88,.65);
    --shadow: 0 2px 12px rgba(0,0,0,.4);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text);
         min-height:100vh; padding-bottom:40px; transition: background .2s; }
  .wrap { max-width:520px; margin:0 auto; padding:14px; }

  /* ---------- онбординг ---------- */
  #onboard { display:none; padding-top:10vh; }
  .ob-card { background:var(--card); border-radius:20px; padding:28px 22px; box-shadow:var(--shadow); text-align:center; }
  .ob-emoji { font-size:52px; margin-bottom:10px; }
  .ob-title { font-size:24px; font-weight:700; margin-bottom:6px; }
  .ob-sub { color:var(--sub); font-size:15px; margin-bottom:20px; line-height:1.4; }
  .ob-label { text-align:left; font-size:13px; font-weight:600; color:var(--sub); margin:16px 0 8px; text-transform:uppercase; letter-spacing:.4px; }
  .cur-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .cur-item { background:var(--chip-bg); border:2px solid transparent; border-radius:12px; padding:10px 4px;
              cursor:pointer; text-align:center; transition:all .15s; }
  .cur-item .s { font-size:20px; font-weight:700; display:block; }
  .cur-item .n { font-size:10px; color:var(--sub); margin-top:2px; }
  .cur-item.active { border-color:var(--accent); background:rgba(255,159,10,.12); }
  .ob-input { width:100%; padding:14px; font-size:22px; font-weight:700; text-align:center;
              background:var(--input-bg); border:2px solid var(--sep); border-radius:14px; color:var(--text); outline:none; }
  .ob-input:focus { border-color:var(--accent); }
  .ob-note { color:var(--sub); font-size:14px; margin-top:14px; line-height:1.45; }
  .btn { display:block; width:100%; padding:15px; border:none; border-radius:14px; font-size:17px; font-weight:600;
         cursor:pointer; margin-top:20px; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; }
  .btn:active { transform:scale(.98); }

  /* ---------- шапка ---------- */
  header { display:flex; justify-content:space-between; align-items:center; padding:4px 2px 12px; }
  header h1 { font-size:22px; font-weight:800; }
  .icon-btn { width:38px; height:38px; border-radius:12px; border:none; background:var(--card); color:var(--text);
              font-size:17px; cursor:pointer; box-shadow:var(--shadow); }

  /* ---------- карточка баланса ---------- */
  .balance-card { background:linear-gradient(135deg,#ff9f0a,#ff6a00); border-radius:20px; padding:22px 20px;
                  color:#fff; box-shadow:0 6px 20px rgba(255,120,0,.30); margin-bottom:16px; }
  .balance-card .label { font-size:13px; opacity:.85; margin-bottom:6px; }
  .balance-card .amount { font-size:34px; font-weight:800; letter-spacing:-.5px; }
  .balance-card .amount.negative { color:#ffd7d5; }
  .balance-card .meta { font-size:12px; opacity:.8; margin-top:6px; }
  .balance-hint { font-size:12px; opacity:.75; margin-top:10px; cursor:pointer; text-decoration:underline dashed; text-underline-offset:3px; }

  /* ---------- ввод ---------- */
  .add-box { background:var(--card); border-radius:16px; padding:14px; box-shadow:var(--shadow); margin-bottom:16px; }
  .add-box input { width:100%; padding:13px 14px; font-size:16px; background:var(--bg); border:none; border-radius:12px;
                   color:var(--text); outline:none; }
  .preview { display:none; align-items:center; gap:8px; margin-top:10px; font-size:14px; flex-wrap:wrap; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .chip { padding:7px 12px; border-radius:20px; background:var(--chip-bg); font-size:13px; cursor:pointer;
          border:2px solid transparent; color:var(--text); }
  .chip.active { border-color:var(--accent); font-weight:600; }

  /* ---------- статистика ---------- */
  h2.sec { font-size:17px; font-weight:700; margin:20px 2px 10px; }
  .periods { display:flex; gap:6px; margin-bottom:12px; }
  .pbtn { flex:1; padding:9px 0; border:none; border-radius:10px; background:var(--chip-bg); color:var(--sub);
          font-size:13px; font-weight:600; cursor:pointer; }
  .pbtn.active { background:var(--card); color:var(--text); box-shadow:var(--shadow); }
  .stat-row { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--card);
              border-radius:12px; margin-bottom:8px; box-shadow:var(--shadow); }
  .stat-row .ic { font-size:20px; }
  .stat-row .info { flex:1; }
  .stat-row .line1 { display:flex; justify-content:space-between; font-size:14px; margin-bottom:5px; }
  .stat-row .line1 .cat { font-weight:600; }
  .stat-row .line1 .sum { color:var(--sub); }
  .bar { height:5px; background:var(--chip-bg); border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:3px; }
  .empty { text-align:center; color:var(--sub); padding:28px 10px; font-size:14px; }

  /* ---------- история ---------- */
  .date-head { font-size:12px; color:var(--sub); font-weight:600; margin:14px 4px 6px; text-transform:capitalize; }
  .exp-row { display:flex; align-items:center; gap:12px; background:var(--card); border-radius:14px;
             padding:12px 14px; margin-bottom:8px; box-shadow:var(--shadow); }
  .exp-row .ic { width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center;
                 font-size:19px; flex-shrink:0; }
  .exp-row .info { flex:1; min-width:0; }
  .exp-row .name { font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .exp-row .cat { font-size:12px; color:var(--sub); margin-top:2px; }
  .exp-row .sum { font-size:15px; font-weight:700; white-space:nowrap; }
  .exp-row .del { border:none; background:none; color:var(--sub); font-size:17px; cursor:pointer; padding:4px; flex-shrink:0; }
</style>
</head>
<body>

<!-- ============ ОНБОРДИНГ ============ -->
<div class="wrap" id="onboard">
  <div class="ob-card">
    <div class="ob-emoji">👋</div>
    <div class="ob-title">Добро пожаловать!</div>
    <div class="ob-sub">Настроим твой кошелёк за 10 секунд</div>

    <div class="ob-label">Выбери валюту</div>
    <div class="cur-grid" id="curGrid"></div>

    <div class="ob-label">Сколько денег у тебя сейчас?</div>
    <input class="ob-input" id="obBalance" type="text" inputmode="decimal" placeholder="0" autofocus>
    <div class="ob-note">С этой суммы мы начнём вести твой баланс 💰<br>Каждая трата будет её уменьшать.</div>
    <button class="btn" onclick="finishOnboard()">Начать учёт</button>
  </div>
</div>

<!-- ============ ОСНОВНОЙ ЭКРАН ============ -->
<div class="wrap" id="main" style="display:none">
  <header>
    <h1>💰 Мои расходы</h1>
    <button class="icon-btn" onclick="exportCSV()" title="Экспорт CSV">↧</button>
  </header>

  <div class="balance-card">
    <div class="label">Осталось на балансе</div>
    <div class="amount" id="balanceAmount">0</div>
    <div class="meta" id="balanceMeta"></div>
    <div class="balance-hint" onclick="openSettings()">Нажми, чтобы изменить баланс или валюту</div>
  </div>

  <div class="add-box">
    <input id="expInput" placeholder="Например: кофе 350" oninput="onInput()" onkeydown="if(event.key==='Enter')addExpense()">
    <div class="preview" id="preview"></div>
    <div class="chips" id="chips"></div>
  </div>

  <h2 class="sec">Статистика</h2>
  <div class="periods">
    <button class="pbtn active" data-p="month" onclick="setPeriod('month')">Месяц</button>
    <button class="pbtn" data-p="week" onclick="setPeriod('week')">Неделя</button>
    <button class="pbtn" data-p="all" onclick="setPeriod('all')">Всё время</button>
  </div>
  <div id="stats"></div>

  <h2 class="sec">История трат</h2>
  <div id="history"></div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

/* ---------- ВАЛЮТЫ ---------- */
const CURRENCIES = [
  { code:'KZT', sym:'₸',   name:'тенге' },
  { code:'RUB', sym:'₽',   name:'рубль' },
  { code:'UAH', sym:'₴',   name:'гривна' },
  { code:'BYN', sym:'Br',  name:'бел. рубль' },
  { code:'USD', sym:'$',   name:'доллар' },
  { code:'KGS', sym:'с',   name:'сом' },
  { code:'UZS', sym:"s'",  name:'сум' },
  { code:'AMD', sym:'֏',   name:'драм' },
];
const curSym = code => (CURRENCIES.find(c=>c.code===code)||CURRENCIES[0]).sym;

/* ---------- КАТЕГОРИИ ---------- */
const CATS = [
  { id:'food',    name:'Еда',         emoji:'🍔', color:'#ff9f0a', kw:['кофе','чай','обед','ужин','завтрак','еда','пицца','бургер','шаверма','шаурма','суп','салат','пекарня','хлеб','молоко','хлеб','продукты','магазин еды','столовая','кафе','ресторан','фастфуд','макдоналдс','kfc','пицца','снек','перекус','вода','сок','напиток','булка','пирожок','сдоба','сладкое','шоколад','конфета','мороженое','ягоды','фрукт','овощ'] },
  { id:'cafe',    name:'Кафе',        emoji:'☕', color:'#bf5af2', kw:['кофейня','старбакс','one price','столовая','бар','паб','пиво','вино','коктейль','шот','коктейль'] },
  { id:'transport',name:'Транспорт',  emoji:'🚕', color:'#0a84ff', kw:['такси','uber','yandex go','яндекс го','везёт','метро','автобус','трамвай','троллейбус','маршрутка','билет','проездной','топливо','бензин','азс','заправка','мойка','парковка','электричка','поезд','самолёт','авиа'] },
  { id:'health',  name:'Здоровье',    emoji:'💊', color:'#32d74b', kw:['аптека','таблетка','лекарство','врач','клиника','стоматолог','анализ','витамины','маска','тест'] },
  { id:'fun',     name:'Развлечения', emoji:'🎬', color:'#ff2d55', kw:['кино','cinema','фильм','подписка','spotify','netflix','youtube','онлайн','игра','steam','концерт','театр','боулинг','бильярд','квест','караоке','парк','аттракцион'] },
  { id:'home',    name:'Дом',         emoji:'🏠', color:'#5e5ce6', kw:['аренда','квартплата','коммуналка','электричество','газ','вода','интернет','wifi','связь','мтс','мегафон','билайн','tele2','телеком','пополнение','мобильный','ремонт','мебель','техника','бытовая','чистящее','стиральный'] },
  { id:'clothes', name:'Одежда',      emoji:'👕', color:'#64d2ff', kw:['одежда','футболка','джинсы','обувь','кроссовки','куртка','кофта','штаны','носки','шапка','ремень','сумка','рюкзак','ozon','wildberries','wb','кас пи','kaspi'] },
  { id:'gifts',   name:'Подарки',     emoji:'🎁', color:'#ff6482', kw:['подарок','презент','цветы','букет','поздравление'] },
  { id:'other',   name:'Другое',      emoji:'📦', color:'#8e8e93', kw:[] },
];
const catById = id => CATS.find(c=>c.id===id) || CATS[CATS.length-1];

/* ---------- СОСТОЯНИЕ ---------- */
let state = { currency:null, balance:0, expenses:[] };
let period = 'month';
let pendingCat = null;
let previewExpense = null;

function load(){ try { const raw = localStorage.getItem('expApp'); if (raw) state = JSON.parse(raw); } catch(e){} }
function save(){ localStorage.setItem('expApp', JSON.stringify(state)); }

function fmt(n){ const sym = curSym(state.currency);
  const v = Math.round(Math.abs(n)*100)/100;
  return (n<0?'−':'') + v.toLocaleString('ru-RU',{maximumFractionDigits:2}) + ' ' + sym; }

function haptic(type){ if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.impactOccurred(type||'light'); } catch(e){} } }

/* ---------- ОНБОРДИНГ ---------- */
let chosenCur = 'KZT';
function renderCurGrid(){
  document.getElementById('curGrid').innerHTML = CURRENCIES.map(c =>
    `<div class="cur-item ${c.code===chosenCur?'active':''}" onclick="chooseCur('${c.code}')">
       <span class="s">${c.sym}</span><span class="n">${c.code}</span>
     </div>`).join('');
}
function chooseCur(code){ chosenCur = code; renderCurGrid(); haptic('light'); }
function finishOnboard(){
  const raw = document.getElementById('obBalance').value.replace(/\s/g,'').replace(',','.');
  const bal = parseFloat(raw) || 0;
  state.currency = chosenCur;
  state.balance = bal;
  state.expenses = state.expenses || [];
  save();
  showMain();
  haptic('medium');
}
function openSettings(){
  const raw = prompt('Новый баланс (сейчас ' + fmt(state.balance) + '):', state.balance);
  if (raw === null) return;
  const bal = parseFloat(raw.replace(/\s/g,'').replace(',','.')) || 0;
  state.balance = bal; save(); renderAll();
}

/* ---------- ПАРСЕР ---------- */
function parseExpense(text){
  const t = text.trim();
  if (!t) return null;
  // ищем число (может быть с пробелами-разделителями тысяч и запятой)
  const m = t.match(/(\d[\d\s]*(?:[.,]\d{1,2})?)/);
  if (!m) return null;
  const amount = parseFloat(m[1].replace(/\s/g,'').replace(',','.'));
  if (!amount || amount <= 0) return null;
  let name = (t.slice(0, m.index) + ' ' + t.slice(m.index + m[1].length)).replace(/\s+/g,' ').trim();
  if (!name) name = 'Трата';
  const low = name.toLowerCase();
  let cat = 'other';
  for (const c of CATS) { if (c.kw.some(k => low.includes(k))) { cat = c.id; break; } }
  return { name, amount, cat };
}

/* ---------- ВВОД ---------- */
function onInput(){
  const text = document.getElementById('expInput').value;
  previewExpense = parseExpense(text);
  pendingCat = previewExpense ? previewExpense.cat : null;
  renderPreview();
}
function renderPreview(){
  const pv = document.getElementById('preview');
  const ch = document.getElementById('chips');
  if (!previewExpense){ pv.style.display='none'; ch.innerHTML=''; return; }
  pv.style.display='flex';
  pv.innerHTML = `<span>${catById(previewExpense.cat).emoji} <b>${previewExpense.name}</b> — ${fmt(previewExpense.amount)} <span style="color:var(--sub)">(${catById(previewExpense.cat).name})</span></span>`;
  ch.innerHTML = CATS.map(c =>
    `<div class="chip ${c.id===pendingCat?'active':''}" onclick="setPendingCat('${c.id}')">${c.emoji} ${c.name}</div>`).join('');
}
function setPendingCat(id){ pendingCat = id; renderPreview(); haptic('light'); }
function addExpense(){
  const input = document.getElementById('expInput');
  const e = parseExpense(input.value);
  if (!e) return;
  const rec = { id: Date.now(), name: e.name, amount: e.amount, cat: pendingCat || e.cat, ts: Date.now() };
  state.expenses.unshift(rec);
  state.balance -= rec.amount;
  save();
  input.value = '';
  previewExpense = null; pendingCat = null;
  renderPreview(); renderAll();
  haptic('medium');
}
function delExpense(id){
  const i = state.expenses.findIndex(x=>x.id===id);
  if (i < 0) return;
  state.balance += state.expenses[i].amount;
  state.expenses.splice(i,1);
  save(); renderAll(); haptic('light');
}

/* ---------- ПЕРИОДЫ ---------- */
function setPeriod(p){
  period = p;
  document.querySelectorAll('.pbtn').forEach(b => b.classList.toggle('active', b.dataset.p===p));
  renderStats();
}

function periodStart(){
  if (period==='all') return 0;
  const d = new Date();
  if (period==='month'){ d.setDate(1); d.setHours(0,0,0,0); }
  else { d.setDate(d.getDate()-7); d.setHours(0,0,0,0); }
  return d.getTime();
}

/* ---------- РЕНДЕР ---------- */
function renderAll(){ renderBalance(); renderStats(); renderHistory(); }

function renderBalance(){
  const el = document.getElementById('balanceAmount');
  el.textContent = fmt(state.balance);
  el.classList.toggle('negative', state.balance < 0);
  const spent = state.expenses.filter(e => e.ts >= new Date(new Date().setDate(1)).setHours(0,0,0,0))
                             .reduce((s,e)=>s+e.amount,0);
  document.getElementById('balanceMeta').textContent =
    `Потрачено за месяц: ${fmt(spent)} · записей: ${state.expenses.length}`;
}

function renderStats(){
  const from = periodStart();
  const sums = {};
  state.expenses.filter(e=>e.ts>=from).forEach(e => sums[e.cat] = (sums[e.cat]||0) + e.amount);
  const total = Object.values(sums).reduce((a,b)=>a+b,0);
  const box = document.getElementById('stats');
  if (!total){ box.innerHTML = `<div class="empty">Пока нет трат за этот период ✨<br>Добавь первую выше!</div>`; return; }
  box.innerHTML = CATS.filter(c=>sums[c.id]).map(c => {
    const v = sums[c.id], pct = Math.round(v/total*100);
    return `<div class="stat-row">
      <div class="ic">${c.emoji}</div>
      <div class="info">
        <div class="line1"><span class="cat">${c.name} · ${pct}%</span><span class="sum">${fmt(v)}</span></div>
        <div class="bar"><i style="width:${pct}%;background:${c.color}"></i></div>
      </div></div>`;
  }).join('');
}

function renderHistory(){
  const box = document.getElementById('history');
  if (!state.expenses.length){ box.innerHTML = `<div class="empty">История пуста</div>`; return; }
  const groups = {};
  state.expenses.forEach(e => {
    const d = new Date(e.ts);
    const key = d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
    (groups[key] = groups[key] || []).push(e);
  });
  box.innerHTML = Object.entries(groups).map(([date,list]) =>
    `<div class="date-head">${date}</div>` + list.map(e => {
      const c = catById(e.cat);
      return `<div class="exp-row">
        <div class="ic" style="background:${c.color}22">${c.emoji}</div>
        <div class="info"><div class="name">${escapeHtml(e.name)}</div><div class="cat">${c.name}</div></div>
        <div class="sum">${fmt(e.amount)}</div>
        <button class="del" onclick="delExpense(${e.id})">✕</button>
      </div>`;
    }).join('')).join('');
}
function escapeHtml(s){ return s.replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }

/* ---------- ЭКСПОРТ ---------- */
function exportCSV(){
  const rows = [['Дата','Название','Категория','Сумма ('+state.currency+')']];
  state.expenses.forEach(e => rows.push([
    new Date(e.ts).toLocaleString('ru-RU'), e.name, catById(e.cat).name, e.amount
  ]));
  const csv = '\ufeff' + rows.map(r => r.map(x => '"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download = 'expenses.csv'; a.click();
}

/* ---------- ТЕМА ---------- */
function applyTheme(){
  const p = tg ? tg.themeParams : {};
  const dark = tg ? (tg.colorScheme === 'dark') : (window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.classList.toggle('dark', dark);
  if (p.bg_color) document.documentElement.style.setProperty('--bg', p.bg_color);
  if (p.secondary_bg_color) document.documentElement.style.setProperty('--card', p.secondary_bg_color);
  if (p.text_color) document.documentElement.style.setProperty('--text', p.text_color);
  if (p.hint_color) document.documentElement.style.setProperty('--sub', p.hint_color);
}

/* ---------- СТАРТ ---------- */
load();
applyTheme();
if (tg && tg.onEvent) tg.onEvent('themeChanged', applyTheme);
if (state.currency === null || state.currency === undefined){
  document.getElementById('onboard').style.display = 'block';
  document.getElementById('main').style.display = 'none';
  renderCurGrid();
} else {
  showMain();
}
function showMain(){
  document.getElementById('onboard').style.display = 'none';
  document.getElementById('main').style.display = 'block';
  renderAll();
}
</script>
</body>
</html>
